<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stock y pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Estilo Demeter (mismo lenguaje que Guías del Local): "green" es el color
     principal de la app, ahora el azul; ámbar y rojo quedan como estados. */
  --kraft:#faf7f2; --kraft-2:#f1ebe0; --paper:#ffffff;
  --ink:#1c1a17; --ink-soft:#6b6459; --line:#e2dbcd;
  --green:#1f4e96; --green-2:#173c74; --green-soft:#e8eef7; --green-line:#c9d6ea;
  --amber:#a8541d; --amber-soft:#f5ead9;
  --red:#b3402a; --red-soft:#f3ddd6;
  --shadow:0 10px 26px -22px rgba(28,26,23,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--kraft);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;overscroll-behavior:none}
.app{width:100%;max-width:560px;min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);transition:max-width .18s ease}
/* pantallas de tabla (config y registro) se ensanchan en compu; en celular quedan al 100% igual */
.app.wide{max-width:1180px}
header{display:flex;align-items:center;gap:10px;padding:18px 2px 12px}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:transform .08s ease,opacity .15s ease}
.iconbtn:active{transform:scale(.94)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.hidden{display:none}
.title{flex:1;min-width:0}
.title h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:2px}
.icons{display:flex;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--kraft-2);overflow:hidden;margin:2px 2px 0}
.bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s ease}
.bar.hidden{display:none}

/* HOME */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 2px 0}
.home h2{font-size:22px;margin:0 2px 16px;font-weight:700}
.home-inner{display:flex;flex-direction:column;gap:14px}
.bigbtn{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;
  background:var(--green);color:#F6F4EC;border:none;border-radius:18px;padding:22px 20px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .08s ease,background .15s ease}
.bigbtn:active{transform:scale(.99)}
.bigbtn .bt{font-size:19px;font-weight:700}
.bigbtn .bs{font-size:13px;opacity:.9;font-weight:500}
.bigbtn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.bigbtn.ghost .bs{color:var(--ink-soft);opacity:1}
.notice{margin:16px 2px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;
  color:var(--ink-soft);background:var(--amber-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

/* CATS */
.cats{flex:1;display:flex;flex-direction:column;padding:6px 2px 0;overflow-y:auto;min-height:0}
.cats-head{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.cats-head h2{font-size:20px;margin:0;font-weight:700}
.catbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .08s ease}
.catbtn:active{transform:scale(.99)}
.catbtn .cn{flex:1;font-weight:600;font-size:16px;color:var(--ink)}
.catbtn .cc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px}

/* COUNT */
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:6px 2px 0;overflow-y:auto;min-height:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:26px 22px 28px;position:relative;min-height:52dvh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.card.enter{animation:enter .2s ease}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.prov{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  letter-spacing:.03em;color:var(--ink-soft);text-transform:uppercase}
.prov .dot{width:8px;height:8px;border-radius:99px;background:var(--green)}
.cat-chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--green-2);background:var(--green-soft);border:1px solid var(--green-line);border-radius:99px;padding:3px 10px;margin-bottom:12px}
.nombre{font-size:26px;line-height:1.14;font-weight:700;margin:6px 0 6px;letter-spacing:-.01em}
.desc{font-size:15px;color:var(--ink-soft);font-weight:500;line-height:1.35}
.minline{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin-top:10px}
.minline b{color:var(--amber);font-weight:700}
.qtywrap{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.qtywrap>label{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.qtyrow{display:flex;align-items:center;gap:12px}
input.bignum{width:130px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:40px;text-align:center;
  color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:2px 4px 8px;outline:none}
input.bignum:focus{border-color:var(--green)}
input.bignum::placeholder{color:#C9BCA1}
.send{width:58px;height:58px;flex:0 0 58px;border-radius:14px;border:none;background:var(--green);color:#F6F4EC;
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .15s ease}
.send:active{transform:scale(.94);background:var(--green-2)}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:15px;font-weight:600;
  cursor:pointer;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.985)}
.btn-ghost{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.btn-ghost:active{background:var(--amber-soft)}
.btn-green{background:var(--green);color:#F6F4EC}
.btn-green:active{background:var(--green-2)}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  color:var(--ink-soft);padding:14px 4px 2px}
.meta b{color:var(--ink);font-weight:700}
.linkbtn{background:none;border:none;color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  cursor:pointer;text-decoration:underline;padding:2px}

/* SAVE */
.save-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 2px 0}
.save-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:28px 22px;text-align:center}
.save-card .big{font-size:44px}
.save-card h3{font-size:20px;margin:12px 0 6px;font-weight:700}
.save-card p{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5}

/* REGISTRO LIST */
.reglist{flex:1;padding:6px 2px 0;overflow-y:auto;min-height:0}
.reg-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.reg-row:active{transform:scale(.99)}
.reg-row .rd{flex:1}
.reg-row .rd .rf{font-weight:700;font-size:16px}
.reg-row .rd .rt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:2px}
.reg-row .chev{color:var(--ink-soft);font-size:20px}

/* REGISTRO VIEW */
.regview{flex:1;display:flex;flex-direction:column;padding:4px 0 0;min-height:0}
.tabs{display:flex;gap:8px;padding:0 2px 10px}
.tab{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:12px;
  padding:11px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.tab.active{background:var(--green);color:#F6F4EC;border-color:var(--green)}
.pane{flex:1;overflow-y:auto;min-height:0;padding:0 2px}
.filters{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.filters select{font-family:inherit;font-size:13px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
.filters select:focus{border-color:var(--green)}
.exportrow{display:flex;gap:8px;margin:0 0 12px}
.exportrow button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;
  padding:11px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.exportrow button:active{background:var(--kraft-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}
table.stock{border-collapse:collapse;width:100%;font-size:13px}
table.stock th,table.stock td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.stock th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);background:var(--kraft-2);position:sticky;top:0}
table.stock td.num,table.stock th.num{text-align:right;font-family:'IBM Plex Mono',monospace}
table.stock tr:last-child td{border-bottom:none}
table.stock td.pedir b{color:var(--red);font-weight:700}
table.stock td.pedir.ok{color:var(--ink-soft)}
.count-note{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin:8px 2px 0}
/* tabla de conteo */
.count-toolbar{display:flex;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
.count-toolbar select,.count-toolbar input{font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.count-toolbar select{flex:0 0 auto;max-width:60%}
.count-toolbar input{flex:1;min-width:120px}
.count-toolbar select:focus,.count-toolbar input:focus{border-color:var(--green)}
.grid td.ro{padding:8px 10px;font-size:14px;color:var(--ink);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.grid td.ro.soft{color:var(--ink-soft)}
.grid td.ro.num{text-align:right;font-family:'IBM Plex Mono',monospace}
.grid td.pedir{padding:8px 10px;text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.grid td.pedir b{color:var(--red);font-weight:700}
.grid td.pedir.ok{color:var(--ink-soft)}

/* PEDIDOS (dentro de registro) */
.copiar-todo{background:var(--green);color:#F6F4EC;border:none;border-radius:12px;padding:13px 14px;
  font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;width:100%;margin-bottom:14px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.copiar-todo:active{background:var(--green-2)}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.ticket .t-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ticket .t-head .p{flex:1;font-weight:700;font-size:16px;letter-spacing:-.01em}
.ticket .t-head .c{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.copybtn{width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background .15s ease}
.copybtn:active{transform:scale(.92)}
.copybtn.ok{background:var(--green-soft);border-color:var(--green-line)}
.lines{list-style:none;margin:0;padding:0;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.55}
.lines li{border-bottom:1px dashed var(--line);padding:5px 0;text-align:left}
.lines li:last-child{border-bottom:none}
.lines b{font-weight:700;color:var(--ink)}
.empty{text-align:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:40px 10px;line-height:1.6}

/* ============================================================
   CONFIG — GRILLA EDITABLE REUTILIZABLE (estilo Sheets)
   Mismo componente que Mise and Please / Protocolos: solo
   cambia CFG_COLUMNS. Filtro tocando todo el encabezado.
   ============================================================ */
.config{flex:1;display:flex;flex-direction:column;padding:4px 0 0;min-height:0}
#cfg-body{flex:1;display:flex;flex-direction:column;min-height:0}
.cfg-head{padding:2px 2px 10px}
.cfg-hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.cfg-scroll{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tbl-wrap{flex:1;overflow:auto;border:1px solid #D8CFBB;border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:620px}
.grid th{position:sticky;top:0;background:#EFE9DB;z-index:2;text-align:left;font-size:12px;color:#6B6250;font-weight:800;padding:8px 8px;border-right:1px solid #D8CFBB;border-bottom:1px solid #C9BFA8;white-space:nowrap}
.grid th .thh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid th.rownum{left:0;z-index:3;width:38px;min-width:38px;text-align:center;padding:8px 0}
.fbtn{border:1px solid #CBBE9E;background:#F7F2E6;color:#8A7F66;width:22px;height:22px;border-radius:5px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.fbtn.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.grid td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle;background:#fff}
.grid tbody tr:nth-child(even) td{background:#FBF8F1}
.grid td.rownum{position:sticky;left:0;z-index:1;width:38px;min-width:38px;text-align:center;color:var(--ink-soft);font-size:12px;font-weight:700;background:#F3EEE1;font-variant-numeric:tabular-nums}
.grid tbody tr:nth-child(even) td.rownum{background:#EEE8D8}
.grid input.cell{display:block;width:100%;min-width:130px;height:34px;border:2px solid transparent;padding:0 8px;font-family:inherit;font-size:14px;line-height:1.2;background:transparent;color:var(--ink);-webkit-user-select:text;user-select:text}
.grid td.numtd input.cell{min-width:66px;text-align:right}
.grid input.cell:focus{outline:none;border:2px solid #1a73e8;background:#fff}
.grid input.cell::placeholder{color:#C3B79B}
.selcell{width:100%;min-width:130px;height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid transparent;background:transparent;font-family:inherit;font-size:14px;line-height:1.2;color:var(--ink);padding:0 8px;cursor:pointer;text-align:left}
.selcell:active{background:#fff}
.selcell .cv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selcell .cv.empty{color:#B4A98F;font-style:italic}
.selcell .car{color:var(--ink-soft);font-size:10px;flex:none}
.grid td.delcol{width:34px;min-width:34px;text-align:center;padding:0}
.delrow{-webkit-appearance:none;appearance:none;display:flex;align-items:center;justify-content:center;width:100%;height:34px;border:none;background:transparent;color:#D64545;font-size:17px;cursor:pointer;padding:0;line-height:1}
.delrow:active{background:#F7E4E1}
.norows{padding:26px;text-align:center;color:var(--ink-soft);font-size:14px;font-weight:600}
.addrow{margin-top:10px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;width:100%}
.addrow:active{transform:scale(.99)}
.cfg-restore{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 2px;align-self:flex-start}
.cfg-msg{font-size:13px;font-weight:700;color:var(--amber);min-height:18px;margin:4px 2px}
.cfg-foot{padding:8px 2px calc(env(safe-area-inset-bottom) + 4px);display:flex;gap:12px}
.cfgbtn{flex:1;border-radius:14px;padding:15px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cfgbtn.save{background:var(--green);color:#F6F4EC;border-color:var(--green)}
.cfgbtn:active{transform:scale(.98)}

/* popover estilo Sheets (filtro + desplegable editable) */
.scrim{position:fixed;inset:0;background:rgba(30,22,10,.14);z-index:20}
.pop{position:fixed;z-index:21;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 55px -18px rgba(60,45,20,.6);width:268px;max-width:84vw;display:flex;flex-direction:column;overflow:hidden}
.pop .psearch{padding:10px}
.pop .psearch input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;background:var(--kraft);color:var(--ink);-webkit-user-select:text;user-select:text}
.pop .pact{display:flex;gap:14px;padding:2px 12px 8px;font-size:12px;border-bottom:1px solid var(--line)}
.pop .pact button{border:none;background:transparent;color:var(--green);font-weight:800;font-family:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.pop .plist{max-height:220px;overflow:auto;padding:6px 12px}
.pop .pitem{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:14px;cursor:pointer;color:var(--ink)}
.pop .pitem input{width:17px;height:17px;flex:none}
.pop .pitem .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .pitem .pv.empty{color:var(--ink-soft);font-style:italic}
.pop .pfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pop .pfoot button{flex:1;border-radius:10px;padding:11px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.pop .pfoot button.ok{background:var(--green);color:#fff;border-color:var(--green)}
.pop .ptitle{padding:11px 12px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:800;border-bottom:1px solid var(--line)}
.pop .olist{max-height:230px;overflow:auto;padding:4px 0}
.opt{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 12px}
.opt .ov{flex:1;font-size:15px;color:var(--ink);cursor:pointer;padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .ov.cur{font-weight:800;color:var(--green)}
.opt .ov.none{color:var(--ink-soft);font-style:italic}
.opt .oi{border:none;background:transparent;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:8px 6px;border-radius:7px;flex:none}
.opt .oi.del{color:#D64545}
.opt .oi.ok{color:var(--green);font-weight:800}
.opt .oi:active{background:var(--kraft)}
.opt.editing{gap:8px}
.opt .oedit{flex:1;border:2px solid #1a73e8;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.pop .newrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.pop .newrow input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;background:var(--kraft);color:var(--ink);-webkit-user-select:text;user-select:text}
.pop .newrow button{border:none;background:var(--green);color:#fff;border-radius:9px;padding:0 14px;font-family:inherit;font-weight:800;font-size:18px;cursor:pointer}

/* PIN */
.pinpad{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:0 2px}
.pinpad h3{font-size:18px;margin:0;font-weight:700}
.pinpad input{width:160px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:32px;text-align:center;letter-spacing:8px;
  color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none}
.pinpad input:focus{border-color:var(--green)}

/* modal de confirmación propio (no depende de confirm()) */
.modal-scrim{position:fixed;inset:0;background:rgba(30,22,10,.38);z-index:40;display:flex;align-items:center;justify-content:center;padding:26px}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:20px;max-width:360px;width:100%;padding:24px;box-shadow:0 30px 70px -20px rgba(60,45,20,.6);text-align:center}
.modal p{font-size:16px;line-height:1.5;color:var(--ink);margin:0 0 20px;font-weight:600}
.modal .mrow{display:flex;gap:12px}
.modal .mrow button{flex:1;border-radius:14px;padding:15px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.modal .mrow button.danger{background:#D64545;color:#fff;border-color:#D64545}
.modal .mrow button:active{transform:scale(.97)}

.restart{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;
  font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;width:100%;margin-top:10px}
.restart:active{background:var(--kraft-2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:var(--paper);font-size:13px;font-weight:500;padding:10px 18px;border-radius:99px;opacity:0;
  pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;font-family:'IBM Plex Mono',monospace;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none !important}
.center-msg{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:40px 20px;line-height:1.6}

/* ============================================================

header{ border-bottom:1mm solid var(--green); padding-bottom:3mm; margin-bottom:4mm; }
.title h1{ font:700 18pt/1.05 Archivo,sans-serif; letter-spacing:-.015em; }

.iconbtn, .copybtn{ border-radius:1.5mm; }
.home h2, .cats-head h2{ font:700 20pt/1.05 Archivo,sans-serif; letter-spacing:-.015em; }
.bigbtn{ border-radius:2mm; }
.bigbtn .bt{ font:700 19px/1.2 Archivo,sans-serif; }
.notice{ border-radius:1.5mm; border-style:dashed; }
.catbtn, .reg-row, .ticket, .save-card, .card{ border-radius:2mm; }
.cat-chip, .catbtn .cc, .ticket .t-head .c{ border-radius:1mm; }
.btn, .send, .restart, .copiar-todo, .exportrow button, .tab, .cfgbtn, .pinpad .go, .pinpad input,
.filters select, .count-toolbar select, .count-toolbar input{ border-radius:1.5mm; }
.tab, .cfgbtn, .pinpad .go, .copiar-todo, .restart, .exportrow button, .btn{

.bar{ height:4px; border-radius:0; } .bar>i{ border-radius:0; }
.tablewrap, .tbl-wrap{ border-radius:1.5mm; border-color:var(--line); }
table.stock th, .grid th{ background:var(--kraft-2); color:var(--ink-soft); font:700 7.5pt/1.4 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
.fbtn{ border-radius:1mm; border-color:var(--line); background:var(--paper); color:var(--ink-soft); }
.fbtn.on{ background:var(--green); border-color:var(--green); }
.grid input.cell:focus{ border-color:var(--green); }
.grid td.rownum{ font-family:'IBM Plex Mono',monospace; color:var(--green); background:var(--kraft-2); }
.grid tbody tr:nth-child(even) td.rownum{ background:#ebe4d6; }
.addrow{ border-radius:1.5mm; border:1px dashed #d8d0c2; font:700 8.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; padding:14px; }
.cfg-restore{ font-family:'IBM Plex Mono',monospace; font-size:12px; }
.pop{ border-radius:1.5mm; }
.pop .psearch input, .pop .newrow input, .pop .pfoot button{ border-radius:1mm; }
.opt .oedit{ border-color:var(--green); }
.modal{ border-radius:2mm; } .modal .mrow button{ border-radius:1.5mm; }
.toast{ border-radius:1.5mm; }

<div class="app">
  <header>
    <button class="iconbtn" id="back" title="Volver" aria-label="Volver">&#8592;</button>
    <div class="title">
      <h1 id="phase">Stock</h1>
      <div class="sub" id="counter">&nbsp;</div>
    </div>
    <div class="icons" id="home-icons">
      <button class="iconbtn" id="nav-reg" title="Registro de stock" aria-label="Registro">&#128203;</button>
      <button class="iconbtn" id="nav-cfg" title="Configuración" aria-label="Configuración">&#9881;</button>
    </div>
  </header>
  <div class="bar" id="progbar"><i id="prog"></i></div>

  <!-- HOME -->
  <main class="home hidden" id="home">
    <h2>Hacer stock</h2>
    <div class="home-inner">
      <button class="bigbtn" id="go-count">
        <span class="bt">Hacer stock</span>
        <span class="bs">Completá la cantidad actual de cada ítem en una tabla</span>
      </button>
    </div>
    <div class="notice hidden" id="home-notice"></div>
  </main>

  <!-- COUNT (tabla editable) -->
  <main class="config hidden" id="count">
    <div class="count-toolbar">
      <select id="ct-cat"></select>
      <input id="ct-search" placeholder="Buscar ítem…" autocomplete="off">
    </div>
    <div class="cfg-scroll">
      <div class="tbl-wrap"><table class="grid" id="count-table"></table></div>
    </div>
    <div class="cfg-foot">
      <button class="cfgbtn" id="count-cancel">Cancelar</button>
      <button class="cfgbtn save" id="count-save">Guardar stock</button>
    </div>
  </main>

  <!-- SAVE -->
  <main class="save-screen hidden" id="save">
    <div class="save-card">
      <div class="big">&#128230;</div>
      <h3 id="save-title">Conteo terminado</h3>
      <p id="save-sub"></p>
      <button class="btn btn-green" id="do-save" style="width:100%">Guardar en el registro</button>
      <button class="restart" id="save-back">Seguir contando</button>
    </div>
  </main>

  <!-- REGISTRO LIST -->
  <main class="reglist hidden" id="reglist"></main>

  <!-- REGISTRO VIEW -->
  <main class="regview hidden" id="regview">
    <div class="tabs">
      <button class="tab active" id="tab-stock" data-tab="stock">Stock</button>
      <button class="tab" id="tab-ped" data-tab="ped">Pedidos</button>
    </div>
    <div class="pane" id="pane-stock">
      <div class="filters">
        <select id="f-cat"></select>
        <select id="f-prov"></select>
      </div>
      <div class="exportrow">
        <button id="copy-sheets">&#9783;&nbsp; Copiar para Sheets</button>
        <button id="dl-csv">&#8681;&nbsp; Descargar CSV</button>
      </div>
      <div class="tablewrap"><table class="stock" id="stock-table"></table></div>
      <div class="count-note" id="stock-note"></div>
    </div>
    <div class="pane hidden" id="pane-ped">
      <button class="copiar-todo" id="copyall">&#9783;&nbsp; Copiar todo</button>
      <div id="tickets"></div>
    </div>
  </main>

  <!-- CONFIG -->
  <main class="config hidden" id="config">
    <div class="pinpad" id="pinpad">
      <h3>Configuración</h3>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
      <button class="go" id="pin-go">Entrar</button>
    </div>
    <div class="hidden" id="cfg-body"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function num(v){ if(v===null||v===undefined) return 0; if(typeof v==="number") return v;
  const s=(""+v).trim().replace(",","."); const n=parseFloat(s); return isNaN(n)?0:n; }
function fmt(n){ if(n===null||n===undefined||n==="") return ""; const x=Math.round(num(n)*100)/100; return x.toString(); }
/* Modelo min-máx: se pide cuando actual <= mínimo, y se repone hasta el ideal.
   pedirRaw = faltante crudo (en unidades de stock); pedirOf = redondeado a paquetes
   enteros si hay unidades por paquete (por_paquete). */
function pedirRaw(it){
  const min=num(it.cantidad_minima), id=num(it.ideal);
  const eff = id>0 ? Math.max(id,min) : min;      // si no hay ideal, el objetivo es el mínimo
  const act=num(it.cantidad_actual);
  if(act>min) return 0;                           // por encima del mínimo → no se pide (banda muerta)
  const need = eff-act;
  return need>0 ? need : 0;
}
function pedirOf(it){
  const raw=pedirRaw(it); if(raw<=0) return 0;
  const upp=num(it.por_paquete);
  return upp>0 ? Math.ceil(raw/upp) : raw;         // redondeo a paquetes enteros
}
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1700); }
function copyText(text, cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>cb&&cb(true)).catch(fallback);
  } else fallback();
  function fallback(){ try{ const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); cb&&cb(true);}catch(e){ cb&&cb(false);} }
}
function todayISO(){ try{ return new Date().toLocaleDateString("sv-SE",{timeZone:TZ}); }catch(e){ return new Date().toISOString().slice(0,10); } }
function fechaLarga(iso){ if(!iso) return "";
  const p=(""+iso).slice(0,10).split("-"); if(p.length<3) return iso; return p[2]+"/"+p[1]+"/"+p[0]; }
function horaDe(ts){ if(!ts) return ""; try{ return new Date(ts).toLocaleTimeString("es-UY",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function catIdx(c){ const i=CATEGORIES.indexOf(c); return i<0?999:i; }
function esc(s){ return (""+(s==null?"":s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* constructor de nodos (para la grilla de configuración) */
function el(tag, props, ...kids){
  props=props||{};
  const n=document.createElement(tag);
  for(const k in props){
    if(k==="cls") n.className=props[k];
    else if(k==="html") n.innerHTML=props[k];
    else if(k==="text") n.textContent=props[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(typeof props[k]==="boolean"){ if(props[k]) n.setAttribute(k,""); }
    else n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c=>c&&n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;
}
function noBubble(node){ ["pointerdown","pointermove","pointerup","touchstart","touchmove","mousedown","click"]
  .forEach(ev=>node.addEventListener(ev,e=>e.stopPropagation())); }
function confirmDialog(msg,onYes,yesLabel){
  const scrim=el("div",{cls:"modal-scrim"});
  const close=()=>scrim.remove();
  scrim.addEventListener("click",e=>{ if(e.target===scrim) close(); });
  const no=el("button",{text:"Cancelar",onClick:close});
  const yes=el("button",{cls:"danger",text:yesLabel||"Sí, continuar",onClick:()=>{ close(); onYes(); }});
  scrim.appendChild(el("div",{cls:"modal"}, el("p",{text:msg}), el("div",{cls:"mrow"}, no, yes)));
  document.body.appendChild(scrim);
}
function closePopovers(){ document.querySelectorAll(".scrim,.pop").forEach(n=>n.remove()); }
function popoverAt(anchor, inner){
  closePopovers();
  const scrim=el("div",{cls:"scrim"}); scrim.addEventListener("click",closePopovers);
  const pop=el("div",{cls:"pop"}, inner); noBubble(pop);
  document.body.append(scrim, pop);
  const r=anchor.getBoundingClientRect();
  const w=Math.min(268, window.innerWidth*0.84);
  let left=Math.max(8, Math.min(r.left, window.innerWidth-w-8));
  let top=r.bottom+6; const maxTop=window.innerHeight-320; if(top>maxTop) top=Math.max(8, maxTop);
  pop.style.left=left+"px"; pop.style.top=top+"px";
  return pop;
}

/* ---------- Supabase (fetch a la API REST) ---------- */
function sbHead(extra){ const h={ "apikey":SUPABASE_ANON, "Authorization":"Bearer "+SUPABASE_ANON, "Content-Type":"application/json" };
  if(extra) Object.assign(h,extra); return h; }
async function sb(method, table, opts){
  opts=opts||{};
  if(!SB_ON) throw new Error("SB_OFF");
  const url = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/" + table + (opts.query?("?"+opts.query):"");
  const res = await fetch(url, { method, headers:sbHead(opts.prefer?{Prefer:opts.prefer}:null),
    body: opts.body?JSON.stringify(opts.body):null });
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("SB "+res.status+" "+t); }
  const txt = await res.text(); return txt?JSON.parse(txt):null;
}

function seedClone(){ return DEFAULT_ITEMS.map((it,i)=>({ id:"seed"+i, categoria:it.categoria, proveedor:it.proveedor,
  item:it.item, paquete:it.paquete, por_paquete:num(it.por_paquete), cantidad_minima:num(it.cantidad_minima), ideal:num(it.ideal), position:i })); }

async function loadItems(){
  if(!SB_ON){ items=seedClone(); offline=true; return; }
  try{
    let rows = await sb("GET","stock_items",{query:"select=*&order=position.asc"});
    if(!rows || rows.length===0){
      const payload = DEFAULT_ITEMS.map((it,i)=>({ categoria:it.categoria, proveedor:it.proveedor, item:it.item,
        paquete:it.paquete, por_paquete:num(it.por_paquete), cantidad_minima:num(it.cantidad_minima), ideal:num(it.ideal), position:i }));
      rows = await sb("POST","stock_items",{ body:payload, prefer:"return=representation" });
      rows.sort((a,b)=>a.position-b.position);
    }
    items=rows; offline=false;
  }catch(e){ items=seedClone(); offline=true; }
}
async function saveConfig(rows){
  const clean = rows.map((r,i)=>({ categoria:r.categoria||"", proveedor:r.proveedor||"", item:(r.item||"").trim(),
    paquete:r.paquete||"", por_paquete:num(r.por_paquete), cantidad_minima:num(r.cantidad_minima), ideal:num(r.ideal), position:i }))
    .filter(r=>r.item!=="");
  if(!SB_ON){ items=clean.map((r,i)=>({ ...r, id:"loc"+i })); return; }
  await sb("DELETE","stock_items",{query:"id=gt.0"});
  if(clean.length){
    const saved = await sb("POST","stock_items",{ body:clean, prefer:"return=representation" });
    saved.sort((a,b)=>a.position-b.position); items=saved;
  } else { items=[]; }
}
async function saveRegistro(rows){
  const fecha = todayISO();
  const snap = rows.map((r,i)=>({ categoria:r.categoria||"", proveedor:r.proveedor||"", item:r.item,
    paquete:r.paquete||"", por_paquete:num(r.por_paquete), cantidad_minima:num(r.cantidad_minima), ideal:num(r.ideal), cantidad_actual:num(r.cantidad_actual), position:i }));
  if(!SB_ON){ const reg={ id:"loc"+Date.now(), fecha, created_at:new Date().toISOString(), _items:snap };
    localRegistros.unshift(reg); return reg; }
  const reg = await sb("POST","stock_registros",{ body:[{fecha}], prefer:"return=representation" });
  const rid = reg[0].id;
  const payload = snap.map(s=>({ ...s, registro_id:rid }));
  await sb("POST","stock_registro_items",{ body:payload });
  return reg[0];
}
async function listRegistros(){
  if(!SB_ON) return localRegistros;

  catch(e){ toast("No se pudo leer el registro"); return []; }

async function loadRegistroItems(reg){

  rows.sort((a,b)=>(ord.indexOf(a.proveedor)-ord.indexOf(b.proveedor))||(a.position||0)-(b.position||0));
  const m=new Map(); rows.forEach(r=>{ const k=r.proveedor||"—"; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); });

      li.appendChild(b); li.appendChild(document.createTextNode((r.paquete?" de ":" ")+r.item));
      ul.appendChild(li); });
    t.appendChild(head); t.appendChild(ul); cont.appendChild(t);
  });
}
function copyAllPedidos(){ const g=pedidosGrouped(); if(!g.size){ toast("Nada para copiar"); return; }
  const b=[]; g.forEach((arr,prov)=>b.push(prov+":\n"+linesOf(arr)));
  copyText(b.join("\n\n"),ok=>toast(ok?"Copiado todo":"No se pudo copiar")); }

/* ============================================================
   CONFIG — GRILLA EDITABLE CON FILTROS (REUSABLE)
   ============================================================ */
const CFG_COLUMNS = [
  { key:"categoria", label:"Categoría", type:"select", allowEmpty:true },
  { key:"proveedor", label:"Proveedor", type:"select", allowEmpty:true },
  { key:"item",      label:"Ítem",      type:"text",   required:true },
  { key:"paquete",   label:"Paquete",   type:"text" },
  { key:"por_paquete", label:"U/paq", type:"num" },
  { key:"cantidad_minima", label:"Mín", type:"num" },
  { key:"ideal", label:"Ideal", type:"num" }
];
let CFG_ROWS=[], CFG_FILTERS={}, CFG_MSG="", _pendingFocus=null;

function showConfig(){
  show("config"); $("phase").textContent="Configuración"; $("counter").innerHTML="&nbsp;";
  $("pinpad").classList.remove("hidden"); $("cfg-body").classList.add("hidden"); $("cfg-body").innerHTML="";
  $("pin").value=""; setTimeout(()=>$("pin").focus(),60);
}
function pinTry(){ if($("pin").value===ADMIN_PIN){ openCfg(); } else { toast("PIN incorrecto"); $("pin").value=""; } }
function openCfg(){
  $("pinpad").classList.add("hidden"); $("cfg-body").classList.remove("hidden");
  CFG_ROWS = items.map(it=>({ categoria:it.categoria||"", proveedor:it.proveedor||"", item:it.item||"",
    paquete:it.paquete||"", por_paquete:num(it.por_paquete), cantidad_minima:num(it.cantidad_minima), ideal:num(it.ideal) }));
  CFG_FILTERS={}; CFG_MSG=""; renderCfg();
}
function cfgVal(r,key){ return (r[key]==null?"":String(r[key])).trim(); }
function uniqueValues(key){ const set=new Map(); CFG_ROWS.forEach(r=>set.set(cfgVal(r,key),true));
  return [...set.keys()].sort((a,b)=> a===""?-1 : b===""?1 : a.localeCompare(b,"es")); }
function rowVisible(r){ return CFG_COLUMNS.every(c=>{ const f=CFG_FILTERS[c.key]; if(!f) return true; return f.has(cfgVal(r,c.key)); }); }

function renderCfg(){
  const host=$("cfg-body"); host.innerHTML="";
  const head=el("div",{cls:"cfg-head"},
    el("div",{cls:"cfg-hint",html:'Se pide cuando el stock llega al <b>mínimo</b>, y se repone hasta el <b>ideal</b>. <b>U/paq</b> = unidades por paquete (redondea el pedido a paquetes enteros). Tocá un encabezado (el <b>▾</b>) para filtrar. El 0 gris es placeholder.'}));

  const table=el("table",{cls:"grid"});
  const thead=el("thead"); const htr=el("tr");
  htr.appendChild(el("th",{cls:"rownum",text:"#"}));
  CFG_COLUMNS.forEach(c=>{
    const active=!!CFG_FILTERS[c.key];
    const fb=el("span",{cls:"fbtn"+(active?" on":""),text:"▾","aria-label":"Filtrar "+c.label});
    const th=el("th",{}, el("div",{cls:"thh"}, el("span",{text:c.label}), fb));
    th.style.cursor="pointer";
    th.addEventListener("click",()=>openFilter(c.key,th));
    htr.appendChild(th);
  });
  htr.appendChild(el("th",{}));
  thead.appendChild(htr); table.appendChild(thead);

  const tbody=el("tbody"); let shown=0;
  CFG_ROWS.forEach((r,idx)=>{
    if(!rowVisible(r)) return; shown++;
    const tr=el("tr");
    tr.appendChild(el("td",{cls:"rownum",text:String(shown)}));
    CFG_COLUMNS.forEach(c=>{
      if(c.type==="select"){
        const v=r[c.key]||"";
        const cell=el("button",{cls:"selcell"},
          el("span",{cls:"cv"+(v?"":" empty"),text: v || (c.allowEmpty?"(ninguno)":"Elegí…")}),
          el("span",{cls:"car",text:"▾"}));
        cell.addEventListener("click",e=>{ e.stopPropagation(); openSelect(c,idx,cell); });
        tr.appendChild(el("td",{}, cell));
      } else if(c.type==="num"){
        const raw=num(r[c.key]); const disp = raw>0 ? fmt(raw) : "";
        const inp=el("input",{cls:"cell",type:"text",inputmode:"decimal",value:disp,placeholder:"0","data-idx":idx,"data-key":c.key});
        inp.addEventListener("input",()=>{ let val=inp.value.replace(/[^0-9.,]/g,"");
          const i=val.search(/[.,]/); if(i!==-1) val=val.slice(0,i+1)+val.slice(i+1).replace(/[.,]/g,"");
          inp.value=val; CFG_ROWS[idx][c.key]=val; });
        tr.appendChild(el("td",{cls:"numtd"}, inp));
      } else {
        const inp=el("input",{cls:"cell",type:"text",value:r[c.key]||"","data-idx":idx,"data-key":c.key,
          placeholder:c.required?c.label:(c.label+" (opcional)")});
        inp.addEventListener("input",()=>{ CFG_ROWS[idx][c.key]=inp.value; });
        tr.appendChild(el("td",{}, inp));
      }
    });
    const del=el("button",{cls:"delrow",text:"✕","aria-label":"Borrar fila"});
    del.addEventListener("click",()=>{ CFG_ROWS.splice(idx,1); renderCfg(); });
    tr.appendChild(el("td",{cls:"delcol"}, del));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const wrap=el("div",{cls:"tbl-wrap"}, table);
  if(shown===0) wrap.appendChild(el("div",{cls:"norows",text: CFG_ROWS.length?"Ningún ítem coincide con los filtros.":"No hay ítems. Agregá el primero abajo."}));

  const add=el("button",{cls:"addrow",text:"＋ Agregar ítem"});
  add.addEventListener("click",()=>{ CFG_FILTERS={};
    const lastCat=CFG_ROWS.length?CFG_ROWS[CFG_ROWS.length-1].categoria:"";
    CFG_ROWS.push({categoria:lastCat,proveedor:"",item:"",paquete:"",por_paquete:0,cantidad_minima:0,ideal:0});
    _pendingFocus={idx:CFG_ROWS.length-1,key:"item"}; renderCfg();
    const w=host.querySelector(".tbl-wrap"); if(w) w.scrollTop=w.scrollHeight; });

  const msg=el("div",{cls:"cfg-msg",text:CFG_MSG});
  const restore=el("button",{cls:"cfg-restore",text:"Restaurar lista original"});
  restore.addEventListener("click",()=>{ confirmDialog("Esto reemplaza TODOS los ítems por la lista original (los 86 por defecto) y borra tus cambios sin guardar. ¿Seguir?",()=>{
    CFG_ROWS=DEFAULT_ITEMS.map(it=>({categoria:it.categoria,proveedor:it.proveedor,item:it.item,paquete:it.paquete,por_paquete:num(it.por_paquete),cantidad_minima:num(it.cantidad_minima),ideal:num(it.ideal)}));
    CFG_FILTERS={}; CFG_MSG="Lista original cargada. Tocá Guardar para dejarla así."; renderCfg(); },"Sí, restaurar"); });

  const body=el("div",{cls:"cfg-scroll"}, wrap, add, restore, msg);

  const cancel=el("button",{cls:"cfgbtn",text:"Cancelar"}); cancel.addEventListener("click",()=>show("home"));
  const save=el("button",{cls:"cfgbtn save",text:"Guardar cambios"});
  save.addEventListener("click",async ()=>{ save.disabled=true; save.textContent="Guardando…"; CFG_MSG="";
    try{ await saveConfig(CFG_ROWS); toast(offline?"Guardado local (sin nube)":"Configuración guardada"); show("home"); }
    catch(e){ CFG_MSG="No se pudo guardar: "+e.message; save.disabled=false; save.textContent="Guardar cambios"; renderCfg(); } });
  const foot=el("div",{cls:"cfg-foot"}, cancel, save);

  host.append(head, body, foot);

  if(_pendingFocus){ const {idx,key}=_pendingFocus; _pendingFocus=null;
    setTimeout(()=>{ const n=host.querySelector('input[data-idx="'+idx+'"][data-key="'+key+'"]'); if(n){ try{n.focus()}catch(e){} } },30); }
}

/* filtro estilo Sheets */
function openFilter(key, anchor){
  const values=uniqueValues(key);
  const temp=new Set(CFG_FILTERS[key]?[...CFG_FILTERS[key]]:values);
  const search=el("input",{type:"text",placeholder:"Buscar…"}); noBubble(search);
  const listBox=el("div",{cls:"plist"});
  function paintList(){ listBox.innerHTML=""; const q=search.value.trim().toLowerCase();
    values.filter(v=>((v===""?"(vacías)":v).toLowerCase().includes(q))).forEach(v=>{
      const cb=el("input",{type:"checkbox"}); cb.checked=temp.has(v);
      cb.addEventListener("change",()=>{ if(cb.checked) temp.add(v); else temp.delete(v); });
      listBox.appendChild(el("label",{cls:"pitem"}, cb, el("span",{cls:"pv"+(v===""?" empty":""),text: v===""?"(vacías)":v}))); }); }
  search.addEventListener("input",paintList);
  const selAll=el("button",{text:"Seleccionar todo",onClick:()=>{ values.forEach(v=>temp.add(v)); paintList(); }});
  const clr=el("button",{text:"Borrar",onClick:()=>{ temp.clear(); paintList(); }});
  const cancelB=el("button",{text:"Cancelar",onClick:closePopovers});
  const okB=el("button",{cls:"ok",text:"Aceptar",onClick:()=>{
    if(temp.size===values.length) delete CFG_FILTERS[key]; else CFG_FILTERS[key]=new Set(temp);
    closePopovers(); renderCfg(); }});
  const inner=el("div",{}, el("div",{cls:"psearch"},search), el("div",{cls:"pact"},selAll,clr), listBox, el("div",{cls:"pfoot"},cancelB,okB));
  paintList(); popoverAt(anchor,inner); setTimeout(()=>{ try{search.focus()}catch(e){} },30);
}

/* desplegable editable de una celda (Categoría / Proveedor) */
function openSelect(col, idx, anchor){
  const key=col.key; const cur=cfgVal(CFG_ROWS[idx],key); let editing=null;
  const list=el("div",{cls:"olist"});
  function renameTo(oldV,newV){ const t=(newV||"").trim();
    if(t&&t!==oldV){ CFG_ROWS.forEach(r=>{ if(cfgVal(r,key)===oldV) r[key]=t; }); }
    editing=null; renderCfg(); closePopovers(); }
  function repaint(){ list.innerHTML="";
    if(col.allowEmpty){ list.appendChild(el("div",{cls:"opt"},
      el("span",{cls:"ov none"+((cur===""||cur==null)?" cur":""),text:"(ninguno)",
        onClick:()=>{ CFG_ROWS[idx][key]=""; closePopovers(); renderCfg(); }}))); }
    uniqueValues(key).filter(v=>v!=="").forEach(v=>{
      if(editing===v){ const inp=el("input",{cls:"oedit",type:"text",value:v}); noBubble(inp);
        inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); renameTo(v,inp.value); } if(e.key==="Escape"){ editing=null; repaint(); } });
        const ok=el("button",{cls:"oi ok",text:"✓",onClick:e=>{ e.stopPropagation(); renameTo(v,inp.value); }});
        list.appendChild(el("div",{cls:"opt editing"}, inp, ok)); setTimeout(()=>{ try{inp.focus();inp.select();}catch(e){} },20); return; }
      const opt=el("div",{cls:"opt"},
        el("span",{cls:"ov"+(v===cur?" cur":""),text:v,onClick:()=>{ CFG_ROWS[idx][key]=v; closePopovers(); renderCfg(); }}),
        el("button",{cls:"oi",text:"✎","aria-label":"Renombrar",onClick:e=>{ e.stopPropagation(); editing=v; repaint(); }}),
        el("button",{cls:"oi del",text:"✕","aria-label":"Quitar",onClick:e=>{ e.stopPropagation();
          confirmDialog('¿Quitar «'+v+'» de la lista? Las filas que lo usan quedarán sin '+col.label.toLowerCase()+'.',()=>{
            CFG_ROWS.forEach(r=>{ if(cfgVal(r,key)===v) r[key]=""; }); closePopovers(); renderCfg(); },"Sí, quitar"); }})
      );
      list.appendChild(opt);
    });
  }
  const nin=el("input",{type:"text",placeholder:"Nueva/o "+col.label.toLowerCase()+"…"}); noBubble(nin);
  const addOne=()=>{ const t=nin.value.trim(); if(t){ CFG_ROWS[idx][key]=t; closePopovers(); renderCfg(); } };
  nin.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addOne(); } });
  const addBtn=el("button",{text:"＋",onClick:addOne});
  const inner=el("div",{}, el("div",{cls:"ptitle",text:col.label+" — tocá el nombre para elegir, ✎ renombra"}),
    list, el("div",{cls:"newrow"}, nin, addBtn));
  repaint(); popoverAt(anchor,inner);
}

/* ---------- back contextual ---------- */
function goBack(){
  const cur=SCREENS.find(s=>!$(s).classList.contains("hidden"));
  if(cur==="count"){ count=null; show("home"); return; }
  if(cur==="save"){ show("count"); renderCountTable(); return; }
  if(cur==="reglist"){ show("home"); return; }
  if(cur==="regview"){ showRegList(); return; }
  if(cur==="config"){ show("home"); return; }
  location.href="../";   // desde el inicio de la app: volver al hub
}

/* ---------- eventos ---------- */
$("go-count").addEventListener("click",startCount);
$("ct-cat").addEventListener("change",renderCountTable);
$("ct-search").addEventListener("input",renderCountTable);
$("count-cancel").addEventListener("click",()=>{ count=null; show("home"); });
$("count-save").addEventListener("click",goSave);
$("nav-reg").addEventListener("click",showRegList);
$("nav-cfg").addEventListener("click",showConfig);
$("back").addEventListener("click",goBack);
$("do-save").addEventListener("click",doSave);
$("save-back").addEventListener("click",()=>{ show("count"); renderCountTable(); });
$("tab-stock").addEventListener("click",()=>setTab("stock"));
$("tab-ped").addEventListener("click",()=>setTab("ped"));
$("f-cat").addEventListener("change",renderStockTable);
$("f-prov").addEventListener("change",renderStockTable);
$("copy-sheets").addEventListener("click",()=>copyText(toTSV(stockMatrix()),ok=>toast(ok?"Copiado — pegalo en Sheets":"No se pudo copiar")));

$("copyall").addEventListener("click",copyAllPedidos);
$("pin-go").addEventListener("click",pinTry);
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); pinTry(); }});

/* ---------- arranque ---------- */
async function boot(){
  show("home");
  $("phase").textContent="Stock";
  if(!SB_ON){ $("home-notice").classList.remove("hidden");
    $("home-notice").textContent="Modo local: falta configurar Supabase (SUPABASE_URL y SUPABASE_ANON en el código). El registro no se guarda en la nube."; }
  await loadItems();
  if(SB_ON && offline){ $("home-notice").classList.remove("hidden");
    $("home-notice").textContent="No se pudo conectar con Supabase. Estás usando la lista por defecto; los cambios y registros no se guardan hasta que haya conexión."; }
}
boot();
