<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guías</title>
<meta name="description" content="Guías de Demeter: buscador de recetas, guías de cocina y demás fichas del local.">
<style>
  :root{
    --paper:#faf7f2;
    --paper-2:#ffffff;
    --ink:#1c1a17;
    --muted:#6b6459;
    --chip:#f1ebe0;
    --accent:#1f4e96;
    --accent-ink:#ffffff;
    --line:#e2dbcd;
    --cut:1px dashed #d8d0c2;
  }
  *{box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif;
    padding-inline:20px;
    padding-block:24px;
  }
  .wrap{max-width:640px;margin:0 auto}

  header.top{
    border-bottom:1mm solid var(--accent);
    padding-bottom:3mm;
    margin-bottom:6mm;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:3mm;
    flex-wrap:wrap;
  }
  header.top h1{
    margin:0;
    font:700 24pt/1 Archivo,sans-serif;
    letter-spacing:-.015em;
  }
  header.top .sub{
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .search-box{
    position:relative;
    margin-bottom:5mm;
  }
  .search-box input{
    width:100%;
    font:500 11pt/1.3 Archivo,sans-serif;
    color:var(--ink);
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:1.5mm;
    padding:3mm 4mm 3mm 10mm;
    outline:none;
  }
  .search-box input::placeholder{color:var(--muted)}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,150,0.14)}
  .search-box svg{
    position:absolute;
    left:3.4mm;
    top:50%;
    transform:translateY(-50%);
    width:4mm;
    height:4mm;
    stroke:var(--muted);
    pointer-events:none;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:1.6mm;
    margin-bottom:5mm;
  }
  .filters button{
    font:700 7.5pt/1.1 'IBM Plex Mono',monospace;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--chip);
    border:1px solid transparent;
    border-radius:99px;
    padding:1.8mm 3.4mm;
    cursor:pointer;
  }
  .filters button:hover{border-color:var(--line)}
  .filters button[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-ink);
  }

  table.recipes{
    width:100%;
    border-collapse:collapse;
    font:400 10.5pt/1.3 Archivo,sans-serif;
  }
  table.recipes thead th{
    text-align:left;
    font:700 7.5pt/1.4 'IBM Plex Mono',monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 2mm 2mm;
    border-bottom:1px solid var(--line);
  }
  table.recipes thead th.num{width:11mm}
  table.recipes thead th.cat{width:30mm}
  table.recipes thead th.yield{width:24mm;text-align:right}
  table.recipes tbody tr{
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  table.recipes tbody tr:hover,
  table.recipes tbody tr:focus-visible{
    background:var(--chip);
  }
  table.recipes tbody tr:last-child{border-bottom:none}
  table.recipes tbody td{
    padding:3mm 2mm;
  }
  table.recipes td.num{
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;
    color:var(--accent);
  }
  table.recipes td.name{
    font:600 10.5pt/1.3 Archivo,sans-serif;
  }
  table.recipes td.cat{
    white-space:nowrap;
  }
  table.recipes td.cat span{
    display:inline-block;
    font:700 7pt/1.1 'IBM Plex Mono',monospace;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--muted);
    background:var(--chip);
    border-radius:1mm;
    padding:1mm 1.8mm;
  }
  table.recipes td.yield{
    text-align:right;
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;
    color:var(--muted);
    white-space:nowrap;
  }
  .empty{
    padding:10mm 2mm;
    text-align:center;
    color:var(--muted);
    font:400 10pt/1.4 Archivo,sans-serif;
  }

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:1.6mm;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:1.5mm;
    padding:2.4mm 4mm;
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
    margin-bottom:5mm;
  }
  .back-btn:hover{background:#173c74}
  .back-btn svg{width:3.2mm;height:3.2mm;stroke:currentColor}

  .card-frame{
    border:var(--cut);
    border-radius:1.5mm;
    background:var(--paper);
    overflow:hidden;
  }
  .card-frame article{
    border:none !important;
    padding:6mm 6mm !important;
  }

  [hidden]{display:none !important}

  /* volver al hub (inicio de Demeter) */
  .home-link{
    display:inline-flex;align-items:center;gap:1.6mm;margin-bottom:4mm;
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;
  }
  .home-link:hover{color:var(--accent)}

  @media (max-width:480px){
    body{padding-inline:14px}
    table.recipes thead th.yield,
    table.recipes td.yield,
    table.recipes thead th.cat,
    table.recipes td.cat{display:none}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="wrap">

  <section id="view-list">
    <a class="home-link" href="../">← Inicio</a>
    <header class="top">
      <h1>Guías</h1>
      <span class="sub" id="count-label">13 recetas</span>
    </header>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="Buscar por nombre…" autocomplete="off">
    </div>

    <div class="filters" id="filters"></div>

    <table class="recipes">
      <thead>
        <tr><th class="num">N°</th><th>Nombre</th><th class="cat">Categoría</th><th class="yield">Rinde</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" hidden>No se encontró nada con esa búsqueda.</div>
  </section>

  <section id="view-detail" hidden>
    <button class="back-btn" id="back-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Volver
    </button>
    <div class="card-frame" id="card-frame"></div>
  </section>

</div>

e-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">5</span><span>Sellar las juntas aplastando</span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">6</span><span>Redondear de nuevo</span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">7</span><span>Aplastar levemente</span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">8</span><span>Congelar</span></li>\n    </ol>\n  </div>\n  <div style=\"margin-top:auto;background:#f1ebe0;padding:2.2mm 2.6mm;display:grid;grid-template-columns:auto 1fr;gap:1mm 3mm;font:400 8.5pt/1.3 Archivo,sans-serif;color:#3a352d\">\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Cocción</span><span><b style=\"font:700 8.5pt 'IBM Plex Mono',monospace\">14 min</b> de horneado</span>\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Bollito</span><span><b style=\"font:700 8.5pt 'IBM Plex Mono',monospace\">50 g</b> · 2 por cookie · relleno <b style=\"font:700 8.5pt 'IBM Plex Mono',monospace\">15 g</b> de dulce de leche</span>\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Empaque</span><span>Congeladas · bolsa 25×30 cm · <b>5 u.</b> · sellado de calor · fecha</span>\n  </div>\n</article>", "categoria": "Recetas"}, {"num": "07", "name": "Budín marmolado", "yield": "", "html": "<article style=\"border:var(--cut,1px dashed #d8d0c2);box-sizing:border-box;padding:5mm 5.5mm;display:flex;flex-direction:column;gap:2mm;overflow:hidden;color:#1c1a17\">\n  <header style=\"border-bottom:1mm solid var(--accent,#1f4e96);padding-bottom:1.8mm;display:flex;align-items:flex-end;justify-content:space-between;gap:2mm\">\n    <h2 style=\"margin:0;font:700 16pt/1.1 Archivo,sans-serif;letter-spacing:-.015em;white-space:nowrap\">Budín marmolado</h2>\n    <span style=\"flex:0 0 auto;background:var(--accent,#1f4e96);color:#fff;padding:0.9mm 2.2mm;border-radius:1mm;font:700 8.5pt/1.1 'IBM Plex Mono',monospace;white-space:nowrap\">07</span>\n  </header>\n  <div>\n    <div style=\"display:flex;align-items:center;gap:1.8mm;margin-bottom:1.8mm\"><span style=\"flex:0 0 auto;width:1.6mm;height:3.8mm;background:var(--accent,#1f4e96);border-radius:0.4mm\"></span><span style=\"font:700 8pt/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#3a352d\">Ingredientes</span><span style=\"flex:1 1 auto;height:1px;background:#e2dbcd\"></span></div>\n    <div style=\"display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,auto);gap:0.3mm 4mm;font:400 8pt/1.25 Archivo,sans-serif\">\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">260 g</b> harina 0000</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">10 g</b> polvo de hornear</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">260 g</b> azúcar</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">20 g</b> cacao amargo</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">180 g</b> manteca pomada</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">1</b> pizca generosa de sal</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">80 ml</b> aceite de girasol</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">1</b> cdita colmada vainilla</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">5</b> huevos</div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">40 g</b> cobertura negra</div>\n      <div></div>\n      <div><b style=\"font:700 8pt 'IBM Plex Mono',monospace\">40 g</b> cobertura blanca</div>\n    </div>\n  </div>\n  <div>\n    <div style=\"display:flex;align-items:center;gap:1.8mm;margin-bottom:1.8mm\"><span style=\"flex:0 0 auto;width:1.6mm;height:3.8mm;background:var(--accent,#1f4e96);border-radius:0.4mm\"></span><span style=\"font:700 8pt/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#3a352d\">Pasos</span><span style=\"flex:1 1 auto;height:1px;background:#e2dbcd\"></span></div>\n    <div style=\"margin:-0.6mm 0 1.6mm 3.4mm;font:700 7.5pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#6b6459\">Batidora · gancho plano</div>\n    <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0.9mm;font:500 8pt/1.22 Archivo,sans-serif\">\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">1</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Precalentar horno; budinera enmantecada y enharinada</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">2</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Cremar manteca + azúcar + sal</span><span style=\"font:700 7.5pt/1.15 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--accent,#1f4e96)\">3-4 min hasta que blanquee</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">3</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Huevos de a uno; vainilla al final</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">4</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Aceite en hilo</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">5</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Harina + polvo de hornear (mezclar solos antes de agregar)</span><span style=\"font:700 7.5pt/1.15 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--accent,#1f4e96)\">3-4 min hasta que no haya grumos</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">6</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Separar un tercio de la masa y agregar cacao; enmoldar variando las capas para el efecto marmolado</span></span></li>\n      <li style=\"display:flex;gap:2mm;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:4.6mm;height:4.6mm;border-radius:50%;background:var(--accent,#1f4e96);color:#fff;font:700 7.5pt/1 'IBM Plex Mono',monospace\">7</span><span style=\"display:flex;flex-direction:column;gap:0.6mm\"><span>Hornear hasta palillo limpio y grieta seca</span><span style=\"font:700 7.5pt/1.15 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--accent,#1f4e96)\">60 min</span></span></li>\n    </ol>\n  </div>\n  <div style=\"margin-top:auto;background:#f1ebe0;padding:2.2mm 2.6mm;display:grid;grid-template-columns:auto 1fr;gap:1mm 3mm;font:400 8.5pt/1.3 Archivo,sans-serif;color:#3a352d\">\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Cocción</span><span>Horno a <b style=\"font:700 8.5pt 'IBM Plex Mono',monospace\">180°</b> · <b style=\"font:700 8.5pt 'IBM Plex Mono',monospace\">40-45 min</b> · no abrir antes de 30 min</span>\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Present.</span><span>Frío: hilos de chocolate blanco</span>\n    <span style=\"font:700 7.5pt/1.4 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6459\">Empaque</span><span>A definir · siempre con fecha visible</span>\n  </div>\n</article>", "categoria": "Recetas"}, {"num": "08", "name": "Almíbar", "yield": "530 g", "html": "<article style=\"border:var(--cut,1px dashed #d8d0c2);box-sizing:border-box;padding:5mm 5.5mm;display:flex;flex-direction:column;gap:2.2 <script>
(function(){
  var recipes = JSON.parse(document.getElementById('recipes-data').textContent);

  var rowsEl = document.getElementById('rows');
  var searchEl = document.getElementById('search');
  var filtersEl = document.getElementById('filters');
  var emptyEl = document.getElementById('empty-msg');
  var countEl = document.getElementById('count-label');
  var viewList = document.getElementById('view-list');
  var viewDetail = document.getElementById('view-detail');
  var cardFrame = document.getElementById('card-frame');
  var backBtn = document.getElementById('back-btn');

  var activeCat = 'Todas';

  function norm(s){
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function renderFilters(){
    var cats = [];
    recipes.forEach(function(r){
      var c = r.categoria || 'Sin categoría';
      if (cats.indexOf(c) === -1) cats.push(c);
    });
    var all = ['Todas'].concat(cats);
    filtersEl.innerHTML = '';
    all.forEach(function(c){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = c;
      btn.setAttribute('aria-pressed', String(c === activeCat));
      btn.addEventListener('click', function(){
        activeCat = c;
        renderFilters();
        renderRows(searchEl.value);
      });
      filtersEl.appendChild(btn);
    });
  }

  function renderRows(filter){
    var q = norm(filter);
    rowsEl.innerHTML = '';
    var shown = 0;
    recipes.forEach(function(r, idx){
      var cat = r.categoria || 'Sin categoría';
      if (activeCat !== 'Todas' && cat !== activeCat) return;
      if (q && norm(r.name).indexOf(q) === -1) return;
      shown++;
      var tr = document.createElement('tr');
      tr.tabIndex = 0;
      tr.setAttribute('role', 'button');
      tr.innerHTML =
        '<td class="num">' + r.num + '</td>' +
        '<td class="name">' + r.name + '</td>' +
        '<td class="cat"><span>' + cat + '</span></td>' +
        '<td class="yield">' + (r.yield || '—') + '</td>';
      tr.addEventListener('click', function(){ openRecipe(idx); });
      tr.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRecipe(idx); }
      });
      rowsEl.appendChild(tr);
    });
    emptyEl.hidden = shown !== 0;
  }

  function openRecipe(idx){
    var r = recipes[idx];
    cardFrame.innerHTML = r.html;
    viewList.hidden = true;
    viewDetail.hidden = false;
    window.scrollTo(0, 0);
  }

  function closeRecipe(){
    viewDetail.hidden = true;
    viewList.hidden = false;
    window.scrollTo(0, 0);
  }

  backBtn.addEventListener('click', closeRecipe);
  searchEl.addEventListener('input', function(){ renderRows(searchEl.value); });

  countEl.textContent = recipes.length + ' fichas';
  renderFilters();
  renderRows('');
})();
</script>
