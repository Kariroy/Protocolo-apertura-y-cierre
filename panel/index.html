<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Estilo Demeter (mismo lenguaje que Guías) */
  :root{
    --paper:#faf7f2; --paper-2:#ffffff; --ink:#1c1a17; --muted:#6b6459; --chip:#f1ebe0;
    --line:#e2dbcd; --accent:#1f4e96; --accent-2:#173c74;
    --ok:#2e7d4f; --ok-soft:#e6f1ea; --warn:#a8541d; --warn-soft:#f5e8dc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif;
    padding-inline:20px;
    padding-block:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-bottom) + 32px);
  }
  .wrap{max-width:760px;margin:0 auto}
  .mono{font-family:'IBM Plex Mono',monospace}
  [hidden]{display:none!important}

  .home-link{display:inline-flex;align-items:center;gap:1.6mm;margin-bottom:4mm;
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);text-decoration:none}
  .home-link:hover{color:var(--accent)}
  header.top{border-bottom:1mm solid var(--accent);padding-bottom:3mm;margin-bottom:5mm;
    display:flex;align-items:flex-end;justify-content:space-between;gap:3mm;flex-wrap:wrap}
  header.top h1{margin:0;font:700 24pt/1 Archivo,sans-serif;letter-spacing:-.015em}
  .sub{font:700 8.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

  /* PIN */
  .pin{display:flex;flex-direction:column;align-items:flex-start;gap:3mm;max-width:340px;padding-top:4mm}
  .pin p{margin:0;color:var(--muted)}
  .pin .row{display:flex;gap:2mm;width:100%}
  .pin input{flex:1;min-width:0;font:700 18pt/1 'IBM Plex Mono',monospace;letter-spacing:.3em;text-align:center;
    padding:3mm;border:1px solid var(--line);border-radius:1.5mm;background:var(--paper-2);color:var(--ink)}
  .pin input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,150,.14)}
  .pin .err{min-height:1.2em;font:700 9pt/1.2 'IBM Plex Mono',monospace;color:var(--warn)}
  .btn{border:none;border-radius:1.5mm;background:var(--accent);color:#fff;cursor:pointer;
    font:700 9pt/1 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;padding:3.4mm 5mm}
  .btn:hover{background:var(--accent-2)}
  .btn.ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--line)}
  .btn:focus-visible,.tab:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* pestañas */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:2mm;flex-wrap:wrap;margin-bottom:5mm}
  .tabs{display:flex;gap:1.6mm;flex-wrap:wrap}
  .tab{font:700 8pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);background:var(--chip);border:1px solid transparent;border-radius:99px;
    padding:2.2mm 3.6mm;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);color:#fff}
  .upd{font:700 7.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

  /* números de resumen */
  .tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2.4mm;margin-bottom:6mm}
  .tile{background:var(--paper-2);border:1px solid var(--line);border-radius:1.5mm;padding:3.4mm 3.6mm}
  .tile .k{font:700 7.5pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font:700 20pt/1.1 Archivo,sans-serif;margin-top:1.6mm;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:11pt;color:var(--muted);font-weight:600}
  .tile .n{font-size:9.5pt;color:var(--muted);margin-top:1mm}

  h2.sec{font:700 8pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#3a352d;
    display:flex;align-items:center;gap:1.8mm;margin:0 0 2.4mm}
  h2.sec::before{content:"";width:1.6mm;height:3.8mm;background:var(--accent);border-radius:.4mm}
  h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

  /* lista de días / registros */
  .list{border-top:1px solid var(--line)}
  .day{display:grid;grid-template-columns:22mm 1fr 1fr 5mm;align-items:center;gap:2mm;width:100%;
    padding:3mm 1mm;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;
    color:var(--ink);font:inherit;cursor:pointer}
  .day:hover{background:var(--chip)}
  .day .d{font:700 8.5pt/1.25 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .day .d span{display:block;color:var(--muted);font-weight:500}
  .day .car{color:var(--muted);font-size:10pt;text-align:right}
  .colhead{display:grid;grid-template-columns:22mm 1fr 1fr 5mm;gap:2mm;padding:0 1mm 2mm;
    font:700 7pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  .st{display:inline-flex;align-items:center;gap:1.4mm;font:700 8pt/1.2 'IBM Plex Mono',monospace;
    border-radius:1mm;padding:1.2mm 2mm;white-space:nowrap;font-variant-numeric:tabular-nums}
  .st.ok{background:var(--ok-soft);color:var(--ok)}
  .st.warn{background:var(--warn-soft);color:var(--warn)}
  .st.none{background:var(--chip);color:var(--muted)}

  .detail{font-size:10pt;padding:3mm 1mm 4mm;border-bottom:1px solid var(--line);background:var(--paper-2);
    display:grid;gap:4mm;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .detail h3{margin:0 0 1.6mm;font:700 11pt/1.2 Archivo,sans-serif}
  .detail ul{margin:0;padding:0;list-style:none;display:grid;gap:1mm;font-size:10pt;line-height:1.35}
  .detail li{display:flex;gap:1.6mm}
  .detail li b{font-family:'IBM Plex Mono',monospace;font-size:9pt}
  .detail .muted,.muted{color:var(--muted)}
  .nota{margin-top:2mm;padding:2.4mm 3mm;border:1px dashed #d8d0c2;border-radius:1.5mm;font-size:10pt;line-height:1.4;white-space:pre-wrap}
  .aviso{padding:3mm 3.4mm;border:1px dashed #d8d0c2;border-radius:1.5mm;background:var(--paper-2);
    font-size:10pt;line-height:1.45;color:var(--muted);margin-bottom:5mm}
  .aviso b{color:var(--ink)}
  .empty{padding:8mm 2mm;text-align:center;color:var(--muted)}
  .grp{margin-bottom:4mm}
  .grp .gt{font:700 7.5pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4mm}
  .item{display:flex;align-items:flex-start;gap:2mm;padding:1.8mm 0;border-bottom:1px solid var(--line);font-size:10.5pt}
  .item .ic{width:4.6mm;flex:none;font-family:'IBM Plex Mono',monospace;font-weight:700}
  .item.done{color:var(--muted);text-decoration:line-through}
  .item .cm{display:block;color:var(--warn);font-size:9.5pt;text-decoration:none}

  /* registro de stock (misma vista que la app de Stock) */
  .regrow{display:flex;align-items:center;gap:3mm;width:100%;padding:3.2mm 1mm;border:none;border-bottom:1px solid var(--line);
    background:none;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
  .regrow:hover{background:var(--chip)}
  .regrow .rd{flex:1;min-width:0}
  .regrow .rf{font:700 11pt/1.2 Archivo,sans-serif}
  .regrow .rt{font:500 8pt/1.3 'IBM Plex Mono',monospace;color:var(--muted);margin-top:.6mm}
  .regrow .chips{display:flex;gap:1.4mm;flex-wrap:wrap;justify-content:flex-end}
  .regrow .chev{color:var(--muted);font-size:14pt}
  .back{display:inline-flex;align-items:center;gap:1.6mm;margin-bottom:4mm}
  .regtitle{font:700 16pt/1.1 Archivo,sans-serif;letter-spacing:-.01em;margin:0 0 3mm}
  .subtabs{display:flex;gap:1.6mm;margin-bottom:4mm}
  .subtabs .tab{flex:1;border-radius:1.5mm;text-align:center}
  .filters{display:flex;gap:2mm;flex-wrap:wrap;margin-bottom:3mm}
  .filters select{font:500 10pt/1.2 Archivo,sans-serif;color:var(--ink);background:var(--paper-2);
    border:1px solid var(--line);border-radius:1.5mm;padding:2.2mm 2.6mm;max-width:100%}
  .exportrow{display:flex;gap:2mm;margin-bottom:3mm}
  .exportrow .btn{flex:1}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:1.5mm;background:var(--paper-2)}
  table.stock{border-collapse:collapse;width:100%;font-size:10pt}
  table.stock th,table.stock td{padding:2.2mm 2.4mm;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  table.stock th{position:sticky;top:0;background:var(--chip);color:var(--muted);
    font:700 7pt/1.3 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
  table.stock td.num,table.stock th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  table.stock td.pedir b{color:var(--warn)}
  table.stock td.soft{color:var(--muted)}
  table.stock tr:last-child td{border-bottom:none}
  .note{font:500 8pt/1.3 'IBM Plex Mono',monospace;color:var(--muted);margin-top:2mm}
  .ticket{background:var(--paper-2);border:1px solid var(--line);border-radius:1.5mm;padding:3.4mm 3.6mm;margin-bottom:3mm}
  .ticket .th{display:flex;align-items:center;gap:2mm;margin-bottom:2mm}
  .ticket .p{flex:1;font:700 11.5pt/1.2 Archivo,sans-serif}
  .ticket .c{font:700 7.5pt/1.2 'IBM Plex Mono',monospace;color:var(--muted);border:1px solid var(--line);border-radius:1mm;padding:1mm 1.8mm}
  .copybtn{border:1px solid var(--line);background:var(--paper-2);border-radius:1.5mm;width:9mm;height:9mm;cursor:pointer;font-size:12pt}
  .copybtn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .lines{list-style:none;margin:0;padding:0;font:500 10pt/1.5 'IBM Plex Mono',monospace}
  .lines li{border-bottom:1px dashed var(--line);padding:1mm 0}
  .lines li:last-child{border-bottom:none}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
    background:var(--ink);color:var(--paper);font:600 9pt/1.2 'IBM Plex Mono',monospace;padding:2.6mm 4mm;border-radius:1.5mm;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
  .toast.show{opacity:1}

  @media (max-width:480px){
    body{padding-inline:14px}
    .day,.colhead{grid-template-columns:17mm 1fr 1fr 4mm}
    .st{padding:1mm 1.4mm;font-size:7.5pt}
    .tiles{gap:1.6mm}
    .tile{padding:2.6mm 2.4mm}
    .tile .v{font-size:15pt}
    .tile .k{font-size:6.5pt}
    .tile .n{font-size:8.5pt}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="../">← Inicio</a>
  <header class="top">
    <h1>Panel de control</h1>
    <span class="sub">Registros del local</span>
  </header>

  <!-- PIN -->
  <section class="pin" id="view-pin">
    <p>Ingresá el PIN para ver los registros.</p>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••" aria-label="PIN">
      <button class="btn" id="pin-go" type="button">Entrar</button>
    </div>
    <div class="err" id="pin-err" role="alert"></div>
  </section>

  <!-- PANEL -->
  <section id="view-panel" hidden>
    <div class="bar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="protocolos" aria-selected="true">Protocolos</button>
        <button class="tab" role="tab" data-tab="stock" aria-selected="false">Stock</button>
        <button class="tab" role="tab" data-tab="mise" aria-selected="false">Mise and Please</button>
        <button class="tab" role="tab" data-tab="tareas" aria-selected="false">Tareas del día</button>
      </div>
      <div style="display:flex;align-items:center;gap:2mm">
        <span class="upd" id="upd"></span>
        <button class="btn ghost" id="reload" type="button">Actualizar</button>
      </div>
    </div>
    <div id="pane"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   CONFIGURACIÓN (igual que en las otras apps)
   ============================================================ */
var SUPABASE_URL  = "https://mohfvdagkqpkeutcbauu.supabase.co";
var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vaGZ2ZGFna3Fwa2V1dGNiYXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTU5NzMsImV4cCI6MjEwNTQzMTk3M30.KKfVxaBjPfvg7XVfqZlIQW0coXj_kWyKxfUomlN7VWg";
var ADMIN_PIN     = "1234";
/* ============================================================ */

var TZ = "America/Montevideo";
var DIAS_PROTOCOLOS = 30;   // cuántos días hacia atrás muestra Protocolos
var REGISTROS_STOCK = 30;   // cuántos conteos de stock muestra

/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, props){
  var n = document.createElement(tag); props = props || {};
  for(var k in props){
    if(k === "cls") n.className = props[k];
    else if(k === "text") n.textContent = props[k];
    else if(k === "onClick") n.addEventListener("click", props[k]);
    else n.setAttribute(k, props[k]);
  }
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i]; if(c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}
function num(v){ if(v == null) return 0; if(typeof v === "number") return v; var n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; }
function fmt(n){ var x = Math.round(num(n) * 100) / 100; return String(x); }
function hoyISO(){ try{ return new Date().toLocaleDateString("sv-SE", { timeZone:TZ }); }catch(e){ return new Date().toISOString().slice(0,10); } }
function restarDias(iso, n){ var d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0,10); }
function diaCorto(iso){ var d = new Date(iso + "T12:00:00Z"); return ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][d.getUTCDay()]; }
function ddmm(iso){ var p = String(iso).slice(0,10).split("-"); return p[2] + "/" + p[1]; }
function hora(ts){ if(!ts) return ""; try{ return new Date(ts).toLocaleTimeString("es-UY", { timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false }); }catch(e){ return ""; } }
function normProto(v){ v = (v || "").trim().toLowerCase(); return v.indexOf("cierre") === 0 ? "cierre" : "apertura"; }

/* ---------- Supabase (solo lectura, por la API REST) ---------- */
async function sbGet(table, query){
  var url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + table + "?" + query;
  var res = await fetch(url, { headers:{ apikey:SUPABASE_ANON, Authorization:"Bearer " + SUPABASE_ANON } });
  if(!res.ok) throw new Error(table + ": " + res.status);
  return res.json();
}

/* ---------- PIN ---------- */
function unlocked(){ try{ return sessionStorage.getItem("panel:ok") === "1"; }catch(e){ return false; } }
function tryPin(){
  if($("pin").value === ADMIN_PIN){
    try{ sessionStorage.setItem("panel:ok", "1"); }catch(e){}
    openPanel();
  } else {
    $("pin-err").textContent = "PIN incorrecto";
    $("pin").value = ""; $("pin").focus();
  }
}
$("pin-go").addEventListener("click", tryPin);
$("pin").addEventListener("keydown", function(e){ if(e.key === "Enter") tryPin(); });

/* ---------- pestañas y carga ---------- */
var TAB = "protocolos";
var DATA = { protocolos:null, stock:null, mise:null };
var ERR = { protocolos:null, stock:null, mise:null };
var OPEN = {};   // filas desplegadas

document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click", function(){
    TAB = b.getAttribute("data-tab");
    document.querySelectorAll(".tab").forEach(function(x){ x.setAttribute("aria-selected", String(x === b)); });
    render();
  });
});
$("reload").addEventListener("click", function(){ loadAll(); });

function openPanel(){
  $("view-pin").hidden = true;
  $("view-panel").hidden = false;
  loadAll();
}

async function loadAll(){
  DATA = { protocolos:null, stock:null, mise:null };
  ERR = { protocolos:null, stock:null, mise:null };
  render();
  await Promise.all([loadProtocolos(), loadStock(), loadMise()]);
  $("upd").textContent = "Actualizado " + hora(new Date().toISOString());
  render();
}

async function loadProtocolos(){
  try{
    var desde = restarDias(hoyISO(), DIAS_PROTOCOLOS - 1);
    var dias = await sbGet("protocolos_dia", "select=*&dia=gte." + desde + "&order=dia.desc");
    var cfg = [];
    try{ cfg = await sbGet("protocolos_config", "select=proto,hasta"); }catch(e){ /* base sin 004 */ }
    var hasta = {};
    cfg.forEach(function(r){ hasta[normProto(r.proto)] = r.hasta ? String(r.hasta).slice(0,5) : null; });
    DATA.protocolos = { dias:dias, hasta:hasta, desde:desde };
  }catch(e){ ERR.protocolos = e.message; }
}

async function loadStock(){
  try{
    var regs = await sbGet("stock_registros", "select=*&order=fecha.desc&limit=" + REGISTROS_STOCK);
    var items = [];
    if(regs.length){
      var ids = regs.map(function(r){ return r.id; }).join(",");
      items = await sbGet("stock_registro_items", "select=*&registro_id=in.(" + ids + ")&order=position.asc");
    }
    var por = {};
    items.forEach(function(it){ (por[it.registro_id] = por[it.registro_id] || []).push(it); });
    DATA.stock = regs.map(function(r){ return { reg:r, items:por[r.id] || [] }; });
  }catch(e){ ERR.stock = e.message; }
}

async function loadMise(){
  try{
    var desde = restarDias(hoyISO(), DIAS_PROTOCOLOS - 1);
    try{
      var regs = await sbGet("mise_registros", "select=*&fecha=gte." + desde + "&order=fecha.desc");
      DATA.mise = { modo:"registro", regs:regs };
    }catch(e){
      // base sin la migración 006: mostrar la lista abierta
      DATA.mise = { modo:"actual", rows: await sbGet("mise_lista", "select=*&order=position.asc") };
    }
  }catch(e){ ERR.mise = e.message; }
}

/* ---------- render ---------- */
function render(){
  var pane = $("pane"); pane.innerHTML = "";
  var fuente = TAB === "tareas" ? "mise" : TAB;
  if(ERR[fuente]){
    pane.appendChild(el("div", { cls:"aviso" }, el("b", { text:"No se pudieron cargar los datos. " }),
      "Revisá la conexión y tocá Actualizar. (" + ERR[fuente] + ")"));
    return;
  }
  if(DATA[fuente] === null){ pane.appendChild(el("div", { cls:"empty", text:"Cargando…" })); return; }
  if(TAB === "protocolos") renderProtocolos(pane);
  else if(TAB === "stock") renderStock(pane);
  else renderMise(pane, TAB === "tareas" ? "tarea" : "produccion");
}

function tile(k, v, total, nota){
  return el("div", { cls:"tile" },
    el("div", { cls:"k", text:k }),
    el("div", { cls:"v" }, String(v), total != null ? el("small", { text:" / " + total }) : null),
    nota ? el("div", { cls:"n", text:nota }) : null);
}

/* ===== Protocolos ===== */
function estadoProto(row, proto, hasta){
  if(!row) return { cls:"none", txt:"— sin hacer", tarde:false, hecho:false };
  var items = Array.isArray(row.items) ? row.items : [];
  var total = items.length, marcados = items.filter(function(i){ return i && i.done; }).length;
  if(row.terminado){
    var h = hora(row.terminado_at || row.updated_at);
    var lim = hasta[proto];
    var tarde = !!(lim && h && h > lim);
    return { cls: tarde ? "warn" : "ok", txt: (tarde ? "⚠ " : "✓ ") + h + (tarde ? " tarde" : ""), tarde:tarde, hecho:true,
             marcados:marcados, total:total };
  }
  return { cls:"warn", txt:"◐ " + marcados + "/" + total, tarde:false, hecho:false, marcados:marcados, total:total };
}

function renderProtocolos(pane){
  var d = DATA.protocolos;
  var by = {};
  d.dias.forEach(function(r){ by[r.dia + "|" + normProto(r.proto)] = r; });

  var hoy = hoyISO(), fechas = [];
  for(var i = 0; i < DIAS_PROTOCOLOS; i++) fechas.push(restarDias(hoy, i));

  // resumen: últimos 7 días
  var ult7 = fechas.slice(0, 7), ap = 0, ci = 0, tarde = 0;
  ult7.forEach(function(f){
    var a = estadoProto(by[f + "|apertura"], "apertura", d.hasta), c = estadoProto(by[f + "|cierre"], "cierre", d.hasta);
    if(a.hecho) ap++; if(c.hecho) ci++; if(a.tarde) tarde++; if(c.tarde) tarde++;
  });
  var lim = [];
  if(d.hasta.apertura) lim.push("apertura hasta " + d.hasta.apertura);
  if(d.hasta.cierre) lim.push("cierre hasta " + d.hasta.cierre);
  pane.appendChild(el("div", { cls:"tiles" },
    tile("Aperturas terminadas", ap, 7, "Últimos 7 días"),
    tile("Cierres terminados", ci, 7, "Últimos 7 días"),
    tile("Terminados fuera de hora", tarde, null, lim.length ? lim.join(" · ") : "Sin hora límite configurada")
  ));

  pane.appendChild(el("h2", { cls:"sec", text:"Últimos " + DIAS_PROTOCOLOS + " días" }));
  pane.appendChild(el("div", { cls:"colhead" }, el("span", { text:"Día" }), el("span", { text:"Apertura" }), el("span", { text:"Cierre" }), el("span")));
  var list = el("div", { cls:"list" });
  fechas.forEach(function(f){
    var ra = by[f + "|apertura"], rc = by[f + "|cierre"];
    var a = estadoProto(ra, "apertura", d.hasta), c = estadoProto(rc, "cierre", d.hasta);
    var key = "p" + f, abierto = !!OPEN[key];
    var btn = el("button", { cls:"day", type:"button", "aria-expanded":String(abierto), onClick:function(){ OPEN[key] = !OPEN[key]; render(); } },
      el("span", { cls:"d" }, diaCorto(f) + " " + ddmm(f), f === hoy ? el("span", { text:"hoy" }) : null),
      el("span", {}, el("span", { cls:"st " + a.cls, text:a.txt })),
      el("span", {}, el("span", { cls:"st " + c.cls, text:c.txt })),
      el("span", { cls:"car", text: abierto ? "▴" : "▾" }));
    list.appendChild(btn);
    if(abierto) list.appendChild(el("div", { cls:"detail" }, detalleProto("Apertura", ra, a), detalleProto("Cierre", rc, c)));
  });
  pane.appendChild(list);
}

function detalleProto(nombre, row, est){
  var box = el("div", {}, el("h3", { text:nombre }));
  if(!row){ box.appendChild(el("div", { cls:"muted", text:"No se abrió este día." })); return box; }
  var items = Array.isArray(row.items) ? row.items : [];
  box.appendChild(el("div", { cls:"muted", style:"margin-bottom:1.6mm",
    text: est.marcados + " de " + est.total + " ítems marcados" + (row.terminado ? " · terminado a las " + hora(row.terminado_at || row.updated_at) : " · no se marcó como terminado") }));
  var faltan = items.filter(function(i){ return i && !i.done; });
  if(faltan.length){
    var ul = el("ul");
    faltan.forEach(function(i){ ul.appendChild(el("li", {}, el("b", { text:"✗" }), i.txt || "")); });
    box.appendChild(el("div", { cls:"muted", style:"margin:1.6mm 0 1mm", text:"Sin marcar:" }));
    box.appendChild(ul);
  }
  if(row.notas) box.appendChild(el("div", { cls:"nota", text:row.notas }));
  return box;
}

/* ===== Stock ===== */
/* misma cuenta que la app de Stock: se pide cuando actual <= mínimo, hasta el ideal,
   redondeado a paquetes enteros; los ítems sin contar no se piden */
function pedirOf(it){
  if(it.contado === false) return 0;
  var min = num(it.cantidad_minima), id = num(it.ideal);
  var eff = id > 0 ? Math.max(id, min) : min, act = num(it.cantidad_actual);
  if(act > min) return 0;
  var need = eff - act; if(need <= 0) return 0;
  var upp = num(it.por_paquete);
  return upp > 0 ? Math.ceil(need / upp) : need;
}

var STOCK_SEL = null;      // índice del registro abierto (null = lista)
var STOCK_SUB = "stock";   // "stock" | "ped"
var STOCK_F = { cat:"", prov:"" };

function fechaLarga(iso){ var p = String(iso).slice(0,10).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function sinAnotar(it){ return it.contado === false; }
var toastT;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 1700); }
function copyText(text, cb){
  function fallback(){ try{ var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); cb(true); }catch(e){ cb(false); } }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ cb(true); }).catch(fallback);
  else fallback();
}

function renderStock(pane){
  var regs = DATA.stock;
  if(!regs.length){ pane.appendChild(el("div", { cls:"empty", text:"Todavía no hay conteos de stock guardados." })); return; }
  if(STOCK_SEL != null && regs[STOCK_SEL]){ renderStockRegistro(pane, regs[STOCK_SEL]); return; }
  STOCK_SEL = null;

  var u = regs[0], aPedir = u.items.filter(function(i){ return pedirOf(i) > 0; }).length;
  pane.appendChild(el("div", { cls:"tiles" },
    tile("Último conteo", ddmm(u.reg.fecha), null, diaCorto(String(u.reg.fecha).slice(0,10)) + " · " + hora(u.reg.created_at)),
    tile("Para pedir", aPedir, null, aPedir === 1 ? "ítem" : "ítems")
  ));

  pane.appendChild(el("h2", { cls:"sec", text:"Registro de stock" }));
  var list = el("div", { cls:"list" });
  regs.forEach(function(r, idx){
    var p = r.items.filter(function(i){ return pedirOf(i) > 0; }).length;
    list.appendChild(el("button", { cls:"regrow", type:"button", onClick:function(){ STOCK_SEL = idx; STOCK_SUB = "stock"; STOCK_F = { cat:"", prov:"" }; render(); window.scrollTo(0, 0); } },
      el("span", { cls:"rd" },
        el("div", { cls:"rf", text:fechaLarga(r.reg.fecha) }),
        el("div", { cls:"rt", text: hora(r.reg.created_at) ? "guardado " + hora(r.reg.created_at) : "" })),
      el("span", { cls:"chips" },
        el("span", { cls:"st " + (p ? "warn" : "ok"), text: p ? p + " a pedir" : "nada a pedir" })),
      el("span", { cls:"chev", text:"›" })));
  });
  pane.appendChild(list);
}

/* vista de un registro: pestañas Stock y Pedidos, como en la app */
function renderStockRegistro(pane, r){
  pane.appendChild(el("button", { cls:"btn ghost back", type:"button", onClick:function(){ STOCK_SEL = null; render(); } }, "← Registros"));
  pane.appendChild(el("h2", { cls:"regtitle", text:"Stock " + fechaLarga(r.reg.fecha) }));
  var tabs = el("div", { cls:"subtabs", role:"tablist" });
  [["stock", "Stock"], ["ped", "Pedidos"]].forEach(function(par){
    tabs.appendChild(el("button", { cls:"tab", role:"tab", type:"button", "aria-selected":String(STOCK_SUB === par[0]),
      onClick:function(){ STOCK_SUB = par[0]; render(); } }, par[1]));
  });
  pane.appendChild(tabs);
  if(STOCK_SUB === "ped") renderPedidos(pane, r); else renderStockTabla(pane, r);
}

function uniq(arr){ return arr.filter(function(v, i){ return v && arr.indexOf(v) === i; }).sort(function(a, b){ return a.localeCompare(b, "es"); }); }
function stockFiltrado(items){
  return items.filter(function(i){
    return (!STOCK_F.cat || i.categoria === STOCK_F.cat) && (!STOCK_F.prov || i.proveedor === STOCK_F.prov);
  });
}

function renderStockTabla(pane, r){
  var items = r.items;
  var filtros = el("div", { cls:"filters" });
  [["cat", "categoria", "(todas las categorías)"], ["prov", "proveedor", "(todos los proveedores)"]].forEach(function(par){
    var sel = el("select", { "aria-label":par[2] });
    sel.appendChild(el("option", { value:"" }, par[2]));
    uniq(items.map(function(i){ return i[par[1]]; })).forEach(function(v){ var o = el("option", { value:v }, v); if(STOCK_F[par[0]] === v) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", function(){ STOCK_F[par[0]] = sel.value; render(); });
    filtros.appendChild(sel);
  });
  pane.appendChild(filtros);

  var rows = stockFiltrado(items);
  pane.appendChild(el("div", { cls:"exportrow" },
    el("button", { cls:"btn ghost", type:"button", onClick:function(){ copyText(toTSV(stockMatrix(rows)), function(ok){ toast(ok ? "Copiado — pegalo en Sheets" : "No se pudo copiar"); }); } }, "Copiar para Sheets"),
    el("button", { cls:"btn ghost", type:"button", onClick:function(){ downloadCSV(rows, r.reg.fecha); } }, "Descargar CSV")));

  var table = el("table", { cls:"stock" });
  var hr = el("tr");
  ["Categoría", "Proveedor", "Ítem", "Mín", "Ideal", "Actual", "Pedir"].forEach(function(h, i){ hr.appendChild(el("th", { cls: i > 2 ? "num" : "" , text:h })); });
  table.appendChild(el("thead", {}, hr));
  var tb = el("tbody");
  rows.forEach(function(i){
    var p = pedirOf(i);
    tb.appendChild(el("tr", {},
      el("td", { text:i.categoria || "" }), el("td", { text:i.proveedor || "" }), el("td", { text:i.item || "" }),
      el("td", { cls:"num", text:fmt(i.cantidad_minima) }), el("td", { cls:"num", text:fmt(i.ideal) }),
      sinAnotar(i) ? el("td", { cls:"num soft", text:"sin anotar" }) : el("td", { cls:"num", text:fmt(i.cantidad_actual) }),
      el("td", { cls:"num pedir" }, p > 0 ? el("b", { text:fmt(p) }) : el("span", { cls:"muted", text:"—" }))));
  });
  table.appendChild(tb);
  pane.appendChild(el("div", { cls:"tablewrap" }, table));
  var tp = rows.filter(function(i){ return pedirOf(i) > 0; }).length, sa = rows.filter(sinAnotar).length;
  pane.appendChild(el("div", { cls:"note", text: rows.length + " ítems · " + tp + " para pedir" + (sa ? " · " + sa + " sin anotar" : "") }));
}

/* exportar (mismo formato que la app de Stock) */
function stockMatrix(rows){
  var head = ["Categoría", "Proveedor", "Ítem", "Mínima", "Ideal", "Actual", "Pedir"];
  return [head].concat(rows.map(function(i){
    return [i.categoria, i.proveedor, i.item, fmt(i.cantidad_minima), fmt(i.ideal), sinAnotar(i) ? "" : fmt(i.cantidad_actual), sinAnotar(i) ? "" : fmt(pedirOf(i))];
  }));
}
function toTSV(m){ return m.map(function(row){ return row.map(function(c){ return String(c == null ? "" : c).replace(/\t/g, " ").replace(/\r?\n/g, " "); }).join("\t"); }).join("\n"); }
function toCSV(m){ return m.map(function(row){ return row.map(function(c){ var s = String(c == null ? "" : c); if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"'; return s; }).join(","); }).join("\r\n"); }
function downloadCSV(rows, fecha){
  var blob = new Blob(["\ufeff" + toCSV(stockMatrix(rows))], { type:"text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "stock_" + String(fecha).slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000); toast("CSV descargado");
}

/* pedidos por proveedor (mismo formato de texto que la app) */
function pedidosGrouped(items){
  var ord = [];
  items.forEach(function(i){ if(ord.indexOf(i.proveedor) < 0) ord.push(i.proveedor); });
  var rows = items.filter(function(i){ return pedirOf(i) > 0; });
  rows.sort(function(a, b){ return (ord.indexOf(a.proveedor) - ord.indexOf(b.proveedor)) || ((a.position || 0) - (b.position || 0)); });
  var m = new Map();
  rows.forEach(function(i){ var k = i.proveedor || "—"; if(!m.has(k)) m.set(k, []); m.get(k).push(i); });
  return m;
}
function lineText(i){ var q = fmt(pedirOf(i)); return "- " + (i.paquete ? (q + " " + i.paquete + " de " + i.item) : (q + " " + i.item)); }
function linesOf(arr){ return arr.map(lineText).join("\n"); }

function renderPedidos(pane, r){
  var g = pedidosGrouped(r.items);
  if(!g.size){ pane.appendChild(el("div", { cls:"empty" }, "Nada para pedir.", el("br"), "Todos los ítems están por encima del mínimo.")); return; }
  pane.appendChild(el("button", { cls:"btn", type:"button", style:"width:100%;margin-bottom:3mm", onClick:function(){
    var b = []; g.forEach(function(arr, prov){ b.push(prov + ":\n" + linesOf(arr)); });
    copyText(b.join("\n\n"), function(ok){ toast(ok ? "Copiado todo" : "No se pudo copiar"); });
  } }, "Copiar todo"));
  g.forEach(function(arr, prov){
    var btn = el("button", { cls:"copybtn", type:"button", "aria-label":"Copiar " + prov, text:"⧉" });
    btn.addEventListener("click", function(){
      copyText("Pedido:\n" + linesOf(arr), function(ok){
        if(!ok){ toast("No se pudo copiar"); return; }
        btn.classList.add("ok"); btn.textContent = "✓"; toast("Copiado: " + prov);
        setTimeout(function(){ btn.classList.remove("ok"); btn.textContent = "⧉"; }, 1400);
      });
    });
    var ul = el("ul", { cls:"lines" });
    arr.forEach(function(i){ ul.appendChild(el("li", {}, "- ", el("b", { text: fmt(pedirOf(i)) + (i.paquete ? " " + i.paquete : "") }), (i.paquete ? " de " : " ") + i.item)); });
    pane.appendChild(el("div", { cls:"ticket" },
      el("div", { cls:"th" }, el("div", { cls:"p", text:prov }), el("div", { cls:"c", text: arr.length + (arr.length === 1 ? " ítem" : " ítems") }), btn),
      ul));
  });
}

/* ===== Mise and Please ===== */
function pct(h, tot){ return tot ? Math.round(h / tot * 100) : null; }
function chipPct(h, tot){
  if(!tot) return el("span", { cls:"st none", text:"—" });
  var p = pct(h, tot);
  return el("span", { cls:"st " + (p === 100 ? "ok" : "warn"), text:(p === 100 ? "✓ " : "◐ ") + p + "% · " + h + "/" + tot });
}

/* tipo = "produccion" (pestaña Mise and Please) o "tarea" (pestaña Tareas del día) */
function renderMise(pane, tipo){
  var d = DATA.mise;
  if(d.modo === "actual"){ renderMiseActual(pane, d.rows); return; }
  var esTarea = tipo === "tarea";
  var H = esTarea ? "tareas_hechas" : "prod_hechas", T = esTarea ? "tareas_total" : "prod_total";
  var by = {};
  d.regs.forEach(function(r){ by[String(r.fecha).slice(0,10)] = r; });
  var hoy = hoyISO(), fechas = [];
  for(var i = 0; i < DIAS_PROTOCOLOS; i++) fechas.push(restarDias(hoy, i));

  // resumen: últimos 7 días (suma de hechas / suma de total)
  var h7 = 0, t7 = 0, dias = 0, completos = 0;
  fechas.slice(0, 7).forEach(function(f){
    var r = by[f]; if(!r || !r[T]) return;
    dias++; h7 += r[H]; t7 += r[T]; if(r[H] === r[T]) completos++;
  });
  var p7 = pct(h7, t7);
  pane.appendChild(el("div", { cls:"tiles" },
    tile(esTarea ? "Tareas completadas" : "Producción completada", p7 == null ? "—" : p7 + "%", null,
      t7 ? h7 + " de " + t7 + " · últimos 7 días" : "Sin registros"),
    tile("Días al 100%", completos, dias || null, "De los días con " + (esTarea ? "tareas" : "lista")),
    tile(esTarea ? "Días con tareas" : "Días con lista", dias, 7, "Últimos 7 días")
  ));
  if(esTarea) pane.appendChild(el("div", { cls:"aviso" }, "Limpieza, mantenimiento y demás tareas fijas que Mise suma a la lista según el día. Se cargan en Mise → ⚙ → Tareas del día."));

  pane.appendChild(el("h2", { cls:"sec", text:"Últimos " + DIAS_PROTOCOLOS + " días" }));
  var list = el("div", { cls:"list" });
  fechas.forEach(function(f){
    var r = by[f], key = (esTarea ? "t" : "m") + f, abierto = !!OPEN[key];
    list.appendChild(el("button", { cls:"regrow", type:"button", "aria-expanded":String(abierto), onClick:function(){ OPEN[key] = !OPEN[key]; render(); } },
      el("span", { cls:"rd" },
        el("div", { cls:"rf", text: diaCorto(f) + " " + ddmm(f) + (f === hoy ? " · hoy" : "") })),
      el("span", { cls:"chips" }, r && r[T] ? chipPct(r[H], r[T]) : el("span", { cls:"st none", text: esTarea ? "— sin tareas" : "— sin lista" })),
      el("span", { cls:"chev", text: abierto ? "▴" : "▾" })));
    if(abierto) list.appendChild(detalleMise(r, tipo));
  });
  pane.appendChild(list);
}

function detalleMise(r, tipo){
  var box = el("div", { cls:"detail" });
  var grupo = r && Array.isArray(r.items) ? r.items.filter(function(i){ return i.tipo === tipo; }) : [];
  if(!grupo.length){ box.appendChild(el("div", { cls:"muted", text: tipo === "tarea" ? "Ese día no hubo tareas." : "Ese día no se armó la lista de producción." })); return box; }
  var faltan = grupo.filter(function(i){ return !i.done; }), hechas = grupo.filter(function(i){ return i.done; });
  var col = el("div", {});
  col.appendChild(el("div", { cls:"muted", style:"margin-bottom:1.6mm", text: hechas.length + " de " + grupo.length + " hechas" }));
  function lista(titulo, arr, marca){
    if(!arr.length) return;
    col.appendChild(el("div", { cls:"muted", style:"margin:1.6mm 0 1mm", text:titulo }));
    var ul = el("ul");
    arr.forEach(function(i){ ul.appendChild(el("li", {}, el("b", { text:marca }),
      el("span", {}, i.txt || "", i.cat ? el("span", { cls:"muted", text:" · " + i.cat }) : null, i.comment ? el("span", { cls:"muted", text:" · " + i.comment }) : null))); });
    col.appendChild(ul);
  }
  lista("Sin hacer:", faltan, "✗");
  lista("Hechas:", hechas, "✓");
  box.appendChild(col);
  return box;
}

/* sin la migración 006: solo la lista abierta ahora */
function renderMiseActual(pane, rows){
  pane.appendChild(el("div", { cls:"aviso" }, el("b", { text:"Falta activar el registro diario de Mise. " }),
    "Corré supabase/006_mise_registro_diario.sql en Supabase. Mientras tanto se ve solo la lista abierta ahora."));
  if(!rows.length){ pane.appendChild(el("div", { cls:"empty", text:"No hay una lista de producción abierta en este momento." })); return; }
  var hechos = rows.filter(function(r){ return r.done; }).length;
  pane.appendChild(el("div", { cls:"tiles" }, tile("Hechas", hechos, rows.length, "Lista actual"), tile("Pendientes", rows.length - hechos, null, "Lista actual")));
  var cats = [], por = {};
  rows.forEach(function(r){ var k = r.cat || "Sin categoría"; if(!por[k]){ por[k] = []; cats.push(k); } por[k].push(r); });
  cats.forEach(function(k){
    var g = el("div", { cls:"grp" }, el("div", { cls:"gt", text:k }));
    por[k].forEach(function(r){
      g.appendChild(el("div", { cls:"item" + (r.done ? " done" : "") },
        el("span", { cls:"ic", text: r.done ? "✓" : "○" }),
        el("span", {}, r.txt || "", r.comment ? el("span", { cls:"cm", text:r.comment }) : null)));
    });
    pane.appendChild(g);
  });
}

if(unlocked()) openPanel(); else setTimeout(function(){ try{ $("pin").focus(); }catch(e){} }, 50);
