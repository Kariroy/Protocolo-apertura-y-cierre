<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Protocolos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E9;
    --card:#ffffff;
    --ink:#2A241D;
    --muted:#A69B8C;
    --line:#E3DBCE;
    --green:#2C9E6A;
    --amber:#E1902B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #F6F1E9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  button { font-family: inherit; }
  #app { min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: stretch; }
  .wrap { width: 100%; max-width: 440px; }
  .full { height: 100vh; height: 100dvh; }

  /* engranaje de configuración */
  .gear{ position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:19px; cursor:pointer;
    z-index:4; display:flex; align-items:center; justify-content:center; }
  .gear:active{ transform:scale(.95); }

  .btn{ display:block; width:100%; border:none; border-radius:18px; padding:19px; font-size:18px;
    font-weight:800; letter-spacing:.3px; background:var(--ink); color:#fff; font-family:inherit; cursor:pointer; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }

  /* ---------- PIN ---------- */
  .pin{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 26px; gap:14px; }
  .pin h2{ font-family:Georgia,serif; font-size:30px; margin:0; font-weight:800; color:var(--ink); }
  .pin p{ color:var(--muted); margin:0 0 6px; }
  .pin input{ width:200px; max-width:70vw; text-align:center; font-size:26px; letter-spacing:8px; padding:14px;
    border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    font-family:inherit; font-weight:800; -webkit-user-select:text; user-select:text; }
  .pin .err{ color:var(--amber); font-size:14px; font-weight:700; min-height:18px; }
  .pin .row{ display:flex; gap:12px; width:100%; max-width:320px; }
  .pin .row .btn{ flex:1; padding:16px; }

  /* ============================================================
     CONFIG — TABLA EDITABLE REUTILIZABLE (grilla tipo Sheets)
     ============================================================ */
  .cfg{ display:flex; flex-direction:column; }
  .cfg .chead{ padding:calc(env(safe-area-inset-top) + 20px) 22px 12px; border-bottom:1px solid var(--line); }
  .cfg h2{ font-family:Georgia,serif; font-size:26px; margin:0; font-weight:800; color:var(--ink); }
  .cfg .hint{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .cfg .cbody{ flex:1; padding:12px 14px 0; display:flex; flex-direction:column; overflow:hidden; }
  .tbl-wrap{ flex:1; overflow:auto; border:1px solid #D8CFBB; border-radius:10px; background:#fff; -webkit-overflow-scrolling:touch; }
  table.grid{ border-collapse:separate; border-spacing:0; width:100%; min-width:360px; }
  .grid th{ position:sticky; top:0; background:#EFE9DB; z-index:2; text-align:left; font-size:12px; color:#6B6250;
    font-weight:800; padding:8px 8px; border-right:1px solid #D8CFBB; border-bottom:1px solid #C9BFA8; white-space:nowrap; }
  .grid th .thh{ display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .grid th.rownum{ left:0; z-index:3; width:38px; min-width:38px; text-align:center; padding:8px 0; }
  .fbtn{ border:1px solid #CBBE9E; background:#F7F2E6; color:#8A7F66; width:22px; height:22px; border-radius:5px;
    font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
  .fbtn.on{ background:#1a73e8; color:#fff; border-color:#1a73e8; }
  .grid td{ padding:0; border-right:1px solid #E7DFCF; border-bottom:1px solid #E7DFCF; vertical-align:middle; background:#fff; }
  .grid tbody tr:nth-child(even) td{ background:#FBF8F1; }
  .grid td.rownum{ position:sticky; left:0; z-index:1; width:38px; min-width:38px; text-align:center; color:#A2977F;
    font-size:12px; font-weight:700; background:#F3EEE1; font-variant-numeric:tabular-nums; }
  .grid tbody tr:nth-child(even) td.rownum{ background:#EEE8D8; }
  .grid input.cell{ display:block; width:100%; min-width:130px; height:34px; border:2px solid transparent; padding:0 8px;
    font-family:inherit; font-size:14px; line-height:1.2; background:transparent; color:var(--ink); -webkit-user-select:text; user-select:text; }
  .grid input.cell:focus{ outline:none; border:2px solid #1a73e8; background:#fff; }
  .selcell{ width:100%; min-width:120px; height:34px; display:flex; align-items:center; justify-content:space-between;
    gap:8px; border:2px solid transparent; background:transparent; font-family:inherit; font-size:14px; line-height:1.2;
    color:var(--ink); padding:0 8px; cursor:pointer; text-align:left; }
  .selcell:active{ background:#fff; }
  .selcell .cv{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .selcell .cv.empty{ color:#B4A98F; font-style:italic; }
  .selcell .car{ color:#A2977F; font-size:10px; flex:none; }
  .grid td.delcol{ width:34px; min-width:34px; text-align:center; padding:0; }
  .delrow{ -webkit-appearance:none; appearance:none; display:flex; align-items:center; justify-content:center; width:100%;
    height:34px; border:none; border-radius:0; background:transparent; color:#D64545; font-size:17px; font-weight:400; cursor:pointer; padding:0; line-height:1; }
  .delrow:active{ background:#F7E4E1; }
  .grid td.movecol{ width:56px; min-width:56px; padding:0; }
  .movebox{ display:flex; height:34px; }
  .moverow{ -webkit-appearance:none; appearance:none; flex:1; display:flex; align-items:center; justify-content:center;
    border:none; border-radius:0; background:transparent; color:var(--accent,#1f4e96); font-size:12px; cursor:pointer; padding:0; line-height:1; }
  .moverow:active{ background:var(--chip,#f1ebe0); }
  .moverow:disabled{ color:#d4ccbc; cursor:default; background:transparent; }
  .norows{ padding:26px; text-align:center; color:var(--muted); font-size:14px; font-weight:600; }
  .addrow{ margin-top:10px; border:1.5px dashed var(--line); background:transparent; color:var(--muted); border-radius:12px;
    padding:13px; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; width:100%; }
  .addrow:active{ transform:scale(.99); }
  .cfg .restore{ background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:700;
    text-decoration:underline; cursor:pointer; padding:8px 2px; align-self:flex-start; }
  .cfg .msg{ font-size:13px; font-weight:700; color:var(--amber); min-height:18px; margin:4px 2px; }
  .cfg .cfoot{ padding:6px 16px calc(env(safe-area-inset-bottom) + 14px); display:flex; gap:12px; }
  .cfg .cfoot .btn{ flex:1; padding:16px; }

  /* segmentado Ítems / Historial */
  .seg{ display:flex; gap:4px; background:#EDE7DD; border-radius:12px; padding:4px; margin:10px 0 2px; }
  .segbtn{ flex:1; border:none; background:transparent; padding:10px; border-radius:9px; font-family:inherit;
    font-weight:800; font-size:14px; color:var(--muted); cursor:pointer; }
  .segbtn.on{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(60,45,20,.14); }

  /* historial */
  .hist{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 14px 14px; }
  .hempty{ text-align:center; color:var(--muted); font-size:14px; font-weight:600; line-height:1.5; padding:34px 18px; }
  .hrow{ border:1px solid var(--line); border-radius:14px; margin-bottom:10px; background:var(--card); overflow:hidden; }
  .hhead{ display:flex; align-items:center; gap:11px; padding:14px; cursor:pointer; }
  .hdot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .hdate{ flex:1; min-width:0; }
  .hdate .d1{ font-weight:800; font-size:15px; color:var(--ink); }
  .hdate .d2{ font-size:12px; color:var(--muted); margin-top:2px; }
  .hpct{ font-weight:800; font-size:13px; padding:4px 10px; border-radius:99px; flex:none; font-variant-numeric:tabular-nums; }
  .hcar{ color:var(--muted); font-size:10px; flex:none; }
  .hbody{ padding:6px 14px 14px; border-top:1px dashed var(--line); }
  .hitem{ display:flex; align-items:flex-start; gap:10px; padding:7px 0; font-size:14px; color:var(--ink); line-height:1.3; }
  .hitem .hk{ font-weight:900; flex:none; width:16px; text-align:center; }
  .hnotas{ margin-top:10px; padding:11px 13px; background:var(--cream); border:1px solid var(--line); border-radius:10px; font-size:14px; color:var(--ink); line-height:1.4; }

  /* popover de filtro (estilo Sheets) */
  .scrim{ position:fixed; inset:0; background:rgba(30,22,10,.14); z-index:20; }
  .pop{ position:fixed; z-index:21; background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 22px 55px -18px rgba(60,45,20,.6); width:268px; max-width:84vw; display:flex; flex-direction:column; overflow:hidden; }
  .pop .psearch{ padding:10px; }
  .pop .psearch input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:10px; font-family:inherit;
    font-size:14px; background:var(--cream); color:var(--ink); -webkit-user-select:text; user-select:text; }
  .pop .pact{ display:flex; gap:14px; padding:2px 12px 8px; font-size:12px; border-bottom:1px solid var(--line); }
  .pop .pact button{ border:none; background:transparent; color:var(--green); font-weight:800; font-family:inherit; font-size:12px; cursor:pointer; padding:2px 0; }
  .pop .plist{ max-height:220px; overflow:auto; padding:6px 12px; }
  .pop .pitem{ display:flex; align-items:center; gap:10px; padding:8px 2px; font-size:14px; cursor:pointer; color:var(--ink); }
  .pop .pitem input{ width:17px; height:17px; flex:none; }
  .pop .pitem .pv{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pop .pitem .pv.empty{ color:var(--muted); font-style:italic; }
  .pop .pfoot{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .pop .pfoot button{ flex:1; border-radius:10px; padding:11px; font-family:inherit; font-weight:800; font-size:14px;
    cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .pop .pfoot button.ok{ background:var(--green); color:#fff; border-color:var(--green); }
  .pop .ptitle{ padding:11px 12px 8px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted);
    font-weight:800; border-bottom:1px solid var(--line); }
  .pop .olist{ max-height:230px; overflow:auto; padding:4px 0; }
  .opt{ display:flex; align-items:center; gap:6px; padding:4px 8px 4px 12px; }
  .opt .ov{ flex:1; font-size:15px; color:var(--ink); cursor:pointer; padding:8px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .opt .ov.cur{ font-weight:800; color:var(--green); }

  /* cartel de confirmación propio */
  .modal-scrim{ position:fixed; inset:0; background:rgba(30,22,10,.38); z-index:40; display:flex; align-items:center; justify-content:center; padding:26px; }
  .modal{ background:var(--card); border:1px solid var(--line); border-radius:20px; max-width:360px; width:100%; padding:24px;
    box-shadow:0 30px 70px -20px rgba(60,45,20,.6); text-align:center; }
  .modal p{ font-size:16px; line-height:1.5; color:var(--ink); margin:0 0 20px; font-weight:600; }
  .modal .mrow{ display:flex; gap:12px; }
  .modal .mrow button{ flex:1; border-radius:14px; padding:15px; font-family:inherit; font-size:15px; font-weight:800;
    cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .modal .mrow button.go{ color:#fff; }
  .modal .mrow button:active{ transform:scale(.97); }

  /* ---------- CHECKLIST ---------- */
  .chk{ display:flex; flex-direction:column; height:100vh; height:100dvh; }
  .chtop{ flex-shrink:0; background:var(--cream); padding:calc(env(safe-area-inset-top) + 12px) 16px 8px; }
  .chk .chead{ display:flex; align-items:center; gap:12px; }
  .iconbtn{ width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    display:grid; place-items:center; cursor:pointer; flex:none; }
  .chk .ct{ font-size:16px; font-weight:800; }
  .chk .cs{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .chk .prog{ height:6px; border-radius:99px; background:#EDE7DD; overflow:hidden; margin:10px 0 0; }
  .chk .prog i{ display:block; height:100%; border-radius:99px; transition:width .3s ease; }
  .chk .list{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px 8px; }
  .item{ display:flex; align-items:flex-start; gap:14px; padding:15px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item .box{ width:28px; height:28px; border-radius:9px; border:2.5px solid var(--muted); flex:none; display:flex;
    align-items:center; justify-content:center; transition:all .15s ease; margin-top:1px; }
  .item .box svg{ width:16px; height:16px; stroke:#fff; stroke-width:3.4; fill:none; opacity:0; }
  .item .num{ font-family:Georgia,serif; font-weight:700; color:#C2B7A6; font-size:15px; min-width:20px; text-align:right; }
  .item .lbl{ font-size:18px; font-weight:600; line-height:1.28; color:var(--ink); flex:1; }
  .item.on .box svg{ opacity:1; }
  .item.on .lbl{ color:var(--muted); text-decoration:line-through; }
  .notas{ margin-top:22px; }
  .notas .nt{ font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:800; color:var(--muted); margin-bottom:8px; }
  .notas textarea{ width:100%; min-height:96px; resize:vertical; border:1px solid var(--line); border-radius:14px;
    padding:13px; font-family:inherit; font-size:16px; line-height:1.4; background:var(--card); color:var(--ink);
    -webkit-user-select:text; user-select:text; }
  .notas textarea:focus{ outline:none; border-color:var(--amber); }
  .chk .cfoot{ flex-shrink:0; background:var(--cream); padding:12px 16px calc(env(safe-area-inset-bottom) + 12px); border-top:1px solid var(--line); }
  .finish{ width:100%; border:none; border-radius:16px; padding:17px; font-family:inherit; font-size:17px; font-weight:800;
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; }
  .finish:active{ transform:scale(.98); }
  .synced{ font-size:11px; color:var(--muted); text-align:center; margin-top:9px; }
  .synced.off{ color:var(--amber); }

  /* ============================================================
     ESTILO DEMETER — mismo lenguaje que Guías del Local
     (Archivo + IBM Plex Mono, acento azul, bordes finos).
     Va al final para pisar lo anterior sin tocar la lógica.
     ============================================================ */
  :root{
    --cream:#faf7f2; --card:#ffffff; --ink:#1c1a17; --muted:#6b6459; --line:#e2dbcd;
    --chip:#f1ebe0; --accent:#1f4e96; --accent-2:#173c74;
    --green:#2e7d4f; --amber:#a8541d;
  }
  html, body{ background:var(--cream); color:var(--ink); font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* inicio: link a Inicio + engranaje, y encabezado con raya azul */
  .hbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4mm; flex-shrink:0; }
  .home-link{ display:inline-flex; align-items:center; gap:1.6mm; font:700 8.5pt/1.1 'IBM Plex Mono',monospace;
    letter-spacing:.04em; text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .home-link:hover{ color:var(--accent); }
  .hbar .gear{ position:static; }
  header.top{ border-bottom:1mm solid var(--accent); padding-bottom:3mm; margin-bottom:6mm; flex-shrink:0;
    display:flex; align-items:flex-end; justify-content:space-between; gap:3mm; flex-wrap:wrap; }
  header.top h1{ margin:0; font:700 24pt/1 Archivo,sans-serif; letter-spacing:-.015em; color:var(--ink); }
  header.top .sub{ font:700 8.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }

  .gear, .iconbtn{ border-radius:1.5mm; border-color:var(--line); background:var(--card); }
  .btn{ border-radius:1.5mm; background:var(--accent); font:700 10.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--line); }

  .pin h2, .cfg h2{ font:700 22pt/1 Archivo,sans-serif; letter-spacing:-.015em; }
  .pin input{ border-radius:1.5mm; border:1px solid var(--line); font-family:'IBM Plex Mono',monospace; }
  .pin input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,78,150,.14); }

  .cfg .chead{ border-bottom:1mm solid var(--accent); }
  .cfg .hint{ color:var(--muted); }
  .tbl-wrap{ border-color:var(--line); border-radius:1.5mm; }
  .grid th{ background:var(--chip); color:var(--muted); font:700 7.5pt/1.4 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; border-color:var(--line); }
  .fbtn{ border-radius:1mm; border-color:var(--line); background:var(--card); color:var(--muted); }
  .fbtn.on{ background:var(--accent); border-color:var(--accent); }
  .grid input.cell:focus{ border-color:var(--accent); }
  .grid td.rownum{ font-family:'IBM Plex Mono',monospace; color:var(--accent); background:var(--chip); }
  .grid tbody tr:nth-child(even) td.rownum{ background:#ebe4d6; }
  .addrow{ border-radius:1.5mm; border:1px dashed #d8d0c2; font:700 8.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; padding:14px; }
  .cfg .restore{ font-family:'IBM Plex Mono',monospace; font-size:12px; }

  .seg{ background:var(--chip); border-radius:1.5mm; }
  .segbtn{ border-radius:1mm; font:700 8.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; padding:11px; }
  .segbtn.on{ background:var(--accent); color:#fff; box-shadow:none; }

  .hrow{ border-radius:1.5mm; }
  .hpct{ border-radius:1mm; font-family:'IBM Plex Mono',monospace; }
  .hnotas{ border-radius:1.5mm; border:1px dashed #d8d0c2; }

  .pop{ border-radius:1.5mm; }
  .pop .psearch input{ border-radius:1mm; background:var(--cream); }
  .pop .pact button, .opt .ov.cur{ color:var(--accent); }
  .pop .pfoot button{ border-radius:1mm; }
  .pop .pfoot button.ok{ background:var(--accent); border-color:var(--accent); }
  .pop .ptitle{ font-family:'IBM Plex Mono',monospace; }

  .modal{ border-radius:2mm; }
  .modal .mrow button{ border-radius:1.5mm; }

  /* checklist */
  .chtop{ border-bottom:1px solid var(--line); padding-bottom:12px; }
  .chk .ct{ font:700 18pt/1 Archivo,sans-serif; letter-spacing:-.015em; }
  .chk .cs{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; margin-top:4px; }
  .chk .prog{ height:4px; border-radius:0; background:var(--chip); }
  .chk .prog i{ border-radius:0; }
  .item .box{ border-radius:1mm; border-width:2px; border-color:#b9b0a2; }
  .item .lbl{ font-weight:500; font-size:17px; }
  .notas .nt{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; }
  .notas textarea{ border-radius:1.5mm; }
  .notas textarea:focus{ border-color:var(--accent); }
  .finish{ border-radius:1.5mm; font:700 10.5pt/1.1 'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; padding:18px; }
  .synced{ font-family:'IBM Plex Mono',monospace; letter-spacing:.03em; }
</style>

<div id="app"></div>

/* ================= Helpers ================= */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function normProto(v){ v = (v||"").trim().toLowerCase(); return v.indexOf("cierre")===0 ? "cierre" : "apertura"; }

function icon(name, size, color, sw){
  size = size || 24; color = color || "currentColor"; sw = sw || 2;
  var w = document.createElement("div");
  w.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+
    '" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
  return w.firstElementChild;
}

function el(tag, props){
  props = props || {};
  var n = document.createElement(tag);
  for(var k in props){
    if(k==="cls") n.className = props[k];
    else if(k==="html") n.innerHTML = props[k];
    else if(k==="text") n.textContent = props[k];
    else if(k==="style"){ for(var s in props[k]) n.style[s] = props[k][s]; }
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(typeof props[k]==="boolean"){ if(props[k]) n.setAttribute(k, ""); }
    else n.setAttribute(k, props[k]);
  }
  for(var i=2;i<arguments.length;i++){
    var kids = arguments[i];
    if(!Array.isArray(kids)) kids = [kids];
    kids.forEach(function(c){ if(c===null||c===undefined||c===false) return; n.appendChild(typeof c==="object"&&c.nodeType?c:document.createTextNode(String(c))); });
  }
  return n;
}
function noBubble(node){
  ["pointerdown","pointermove","pointerup","touchstart","touchmove","mousedown","click"].forEach(function(ev){
    node.addEventListener(ev, function(e){ e.stopPropagation(); });
  });
}
function buzz(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

/* cartel de confirmación propio (no depende de confirm() del navegador) */
function confirmDialog(msg, onYes, yesLabel, goColor){
  var scrim = el("div",{cls:"modal-scrim"});
  var close = function(){ scrim.remove(); };
  scrim.addEventListener("click", function(e){ if(e.target===scrim) close(); });
  var no = el("button",{text:"Cancelar", onClick:close});
  var yes = el("button",{cls:"go", text:yesLabel||"Sí, continuar", onClick:function(){ close(); onYes(); }});
  if(goColor) yes.style.background = goColor;
  scrim.appendChild(el("div",{cls:"modal"}, el("p",{text:msg}), el("div",{cls:"mrow"}, no, yes)));
  app.appendChild(scrim);
}

/* estallido de destellos al terminar */
function sparkleBurst(cx, cy, base){
  var layer = document.createElement("div");
  layer.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;z-index:9999;pointer-events:none;";
  document.body.appendChild(layer);
  var colors = [base||"#1f4e96","#5b82c4","#a9c0e6","#ffffff","#dbe5f4"];
  for(var i=0;i<22;i++){
    var p = document.createElement("div");
    var size = 6 + Math.random()*9;
    p.style.cssText = "position:absolute;left:"+cx+"px;top:"+cy+"px;width:"+size+"px;height:"+size+
      "px;border-radius:50%;background:"+colors[i%colors.length]+
      ";transform:translate(-50%,-50%);opacity:1;transition:transform .62s cubic-bezier(.15,.7,.3,1),opacity .62s ease;";
    layer.appendChild(p);
    var ang = Math.random()*Math.PI*2;
    var dist = 70 + Math.random()*150;
    (function(node, dx, dy){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        node.style.transform = "translate(-50%,-50%) translate("+dx+"px,"+dy+"px) scale(0)";
        node.style.opacity = "0";
      }); });
    })(p, Math.cos(ang)*dist, Math.sin(ang)*dist - 40);
  }
  setTimeout(function(){ if(layer.parentNode) layer.parentNode.removeChild(layer); }, 720);
}

/* ---- ítems editables (panel de config) ---- */
function defaultRows(){
  var rows=[], p=0;
  PROTO_KEYS.forEach(function(k){
    DEFAULT_ITEMS[k].forEach(function(txt){ rows.push({ proto:PROTO_LABEL[k], txt:txt, position:p++ }); });
  });
  return rows;
}
function setItemsFromRows(rows){
  var by = { apertura:[], cierre:[] };
  rows.slice().sort(function(a,b){ return (a.position||0)-(b.position||0); }).forEach(function(r){
    by[normProto(r.proto)].push(r.txt);
  });
  PROTOCOLOS.apertura.items = by.apertura;
  PROTOCOLOS.cierre.items = by.cierre;
}
async function fetchItems(){
  var res = await sb.from(ITEMS_TABLE).select("*").order("position",{ascending:true});
  if(res.error) throw res.error;
  return res.data || [];
}
async function seedItems(){
  var res = await sb.from(ITEMS_TABLE).insert(defaultRows());
  if(res.error) throw res.error;
}
async function saveItems(rows){
  var reqCols = COLUMNS.filter(function(c){ return c.required; });
  var clean = rows.map(function(r){
    var o = {};
    COLUMNS.forEach(function(c){
      var v = (r[c.key]==null?"":String(r[c.key])).trim();
      if(!v) v = c.required ? "" : (c.emptyDefault!==undefined ? c.emptyDefault : null);
      o[c.key] = v;
    });
    o.proto = PROTO_LABEL[normProto(o.proto)];
    return o;
  }).filter(function(r){ return reqCols.every(function(c){ return r[c.key]; }); });
  if(clean.length===0) return { ok:false, msg:"La lista quedó vacía." };
  clean.forEach(function(r,i){ r.position = i; });
  if(sb){
    try{
      await sb.from(ITEMS_TABLE).delete().gte("id", 0);
      var ins = await sb.from(ITEMS_TABLE).insert(clean);
      if(ins.error) throw ins.error;
      var items = await fetchItems();
      setItemsFromRows(items);
    }catch(e){ return { ok:false, msg:"No se pudo guardar en Supabase." }; }
  } else {
    setItemsFromRows(clean);
  }
  return { ok:true };
}
async function restoreDefaults(){
  if(sb){
    try{
      await sb.from(ITEMS_TABLE).delete().gte("id", 0);
      await seedItems();
      var items = await fetchItems();
      setItemsFromRows(items);
    }catch(e){ return { ok:false, msg:"No se pudo restaurar." }; }
  } else {
    PROTOCOLOS.apertura.items = DEFAULT_ITEMS.apertura.slice();
    PROTOCOLOS.cierre.items   = DEFAULT_ITEMS.cierre.slice();
  }
  return { ok:true };
}

/* ---- registro por día (checklist + notas + historial en una fila por proto/día) ---- */
function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function seedChk(proto){ return PROTOCOLOS[proto].items.map(function(t){ return { txt:t, done:false }; }); }
function normItems(items, proto){
  if(!Array.isArray(items) || items.length===0) return seedChk(proto);
  return items.map(function(it){ return { txt:(it&&it.txt)||"", done:!!(it&&it.done) }; });
}
async function fetchDia(proto, dia){
  var res = await sb.from(DIA_TABLE).select("*").eq("proto", proto).eq("dia", dia).limit(1);
  if(res.error) throw res.error;
  return (res.data && res.data[0]) || null;
}
async function createDia(proto, dia){
  var payload = { proto:proto, dia:dia, items: seedChk(proto), notas:null, terminado:false };
  try{
    var ins = await sb.from(DIA_TABLE).insert(payload).select();
    if(!ins.error && ins.data && ins.data[0]) return ins.data[0];
  }catch(e){}
  return await fetchDia(proto, dia);   // pudo haberla creado otro al mismo tiempo
}
async function pushItems(){
  if(sb && DIA_ID != null){
    try{ await sb.from(DIA_TABLE).update({ items:CHK, updated_at:new Date().toISOString() }).eq("id", DIA_ID); }catch(e){}
  }
}
async function pushNota(){
  if(sb && DIA_ID != null){
    try{ await sb.from(DIA_TABLE).update({ notas:(NOTA||null), updated_at:new Date().toISOString() }).eq("id", DIA_ID); }catch(e){}
  }
}

/* ---- realtime: escucha la fila de hoy de este protocolo ---- */
var channel = null;
function stopRealtime(){ if(sb && channel){ try{ sb.removeChannel(channel); }catch(e){} } channel = null; }
function startRealtime(proto, dia){
  if(!sb || channel) return;
  channel = sb.channel("dia-"+proto)
    .on("postgres_changes", { event:"*", schema:"public", table:DIA_TABLE, filter:"proto=eq."+proto }, async function(){
      if(state.screen!=="check" || state.protoKey!==proto) return;
      try{
        var row = await fetchDia(proto, dia);
        if(!row) return;
        DIA_ID = row.id;
        CHK = normItems(row.items, proto);
        if(!_notaFocus) NOTA = row.notas || "";
        render();
      }catch(e){}
    })
    .subscribe();
}

/* ================= Estado de la app ================= */
var state = { screen:"home", protoKey:null };
var CHK = [];          // [{txt, done}]
var NOTA = "";
var DIA_ID = null;     // id de la fila de hoy en Supabase
var _notaFocus = false;
var app = document.getElementById("app");
var _pinErr = "";

async function init(){
  state.screen = "home"; render();
  if(!sb) return;
  try{
    var items = await fetchItems();
    if(items.length===0){ await seedItems(); items = await fetchItems(); }
    if(items.length) setItemsFromRows(items);
    if(state.screen === "home") render();
  }catch(e){ /* respaldo: items por defecto */ }
}

function goHome(){ stopRealtime(); state.screen="home"; state.protoKey=null; CHK=[]; NOTA=""; DIA_ID=null; render(); }

async function openProto(key){
  state.protoKey = key; state.screen = "check"; NOTA = ""; DIA_ID = null;
  CHK = seedChk(key);
  render();
  if(!sb) return;
  try{
    var dia = todayStr();
    var row = await fetchDia(key, dia);
    if(!row) row = await createDia(key, dia);
    if(row){ DIA_ID = row.id; CHK = normItems(row.items, key); NOTA = row.notas || ""; }
    startRealtime(key, dia);
    if(state.screen==="check" && state.protoKey===key) render();
  }catch(e){ /* respaldo local ya renderizado */ }
}

function toggleItem(row){
  row.done = !row.done;
  render();
  buzz(row.done ? 16 : 10);
  pushItems();
}

function finishProto(){
  var proto = state.protoKey;
  var faltan = CHK.filter(function(r){ return !r.done; }).length;
  var msg = faltan>0
    ? "Quedan "+faltan+" ítem"+(faltan>1?"s":"")+" sin marcar. ¿Marcar el protocolo de hoy como terminado igual? Queda guardado el registro del día."
    : "¿Marcar el protocolo de hoy como terminado? Queda guardado el registro del día.";
  confirmDialog(msg, async function(){
    var accent = PROTOCOLOS[proto].accent;
    sparkleBurst(window.innerWidth/2, window.innerHeight*0.42, accent);
    buzz(28);
    if(sb && DIA_ID != null){
      try{ await sb.from(DIA_TABLE).update({ items:CHK, notas:(NOTA||null), terminado:true, updated_at:new Date().toISOString() }).eq("id", DIA_ID); }catch(e){}
    }
    goHome();
  }, "Sí, terminar", PROTOCOLOS[proto].accent);
}

/* ================= Render ================= */
var _renderedScreen = null;
function render(){
  var prevList = app.querySelector(".list"); var listY = prevList ? prevList.scrollTop : 0;
  var prevTbl = app.querySelector(".tbl-wrap"); var tblY = prevTbl ? prevTbl.scrollTop : 0;
  var prevHist = app.querySelector(".hist"); var histY = prevHist ? prevHist.scrollTop : 0;
  var prevScreen = _renderedScreen;
  app.innerHTML = "";
  document.body.style.overflow = "hidden";
  var wrap = el("div", { cls:"wrap" });
  if(state.screen === "home") renderHome(wrap);
  else if(state.screen === "check") renderCheck(wrap);
  else if(state.screen === "pin") renderPin(wrap);
  else if(state.screen === "config") renderConfig(wrap);
  app.appendChild(wrap);
  _renderedScreen = state.screen;
  if(prevScreen === state.screen){
    var l = app.querySelector(".list"); if(l) l.scrollTop = listY;
    var t = app.querySelector(".tbl-wrap"); if(t) t.scrollTop = tblY;
    var hh = app.querySelector(".hist"); if(hh) hh.scrollTop = histY;
  }
}

  ));
  wrap.appendChild(el("header", { cls:"top" },
    el("h1", { text:"Protocolos" }),
    el("span", { cls:"sub", text:"¿Qué vas a registrar?" })
  ));

  var grid = el("div", { style:{ display:"flex", flexDirection:"column", gap:"14px", flex:"1", minHeight:"0" } });

    var p = PROTOCOLOS[k];

      onClick: function(){ openProto(k); },
      style:{ display:"flex", alignItems:"center", gap:"16px", padding:"26px 20px", borderRadius:"2mm",
        cursor:"pointer", border:"1px solid "+p.accent+"40", background:p.accentSoft, textAlign:"left", width:"100%",
        flex:"1", minHeight:"110px", transition:"transform .12s ease" }
    },
      iconBox,
      el("div", { style:{ flex:"1" } },
        el("div", { style:{ fontSize:"21px", fontWeight:"700", color:p.ink, lineHeight:"1.2", letterSpacing:"-.01em" }, text:p.nombre })
      ),
      icon("chevron", 24, p.accent)
    );

/* ---------- CHECKLIST ---------- */
function renderCheck(wrap){
  var proto = PROTOCOLOS[state.protoKey];
  var accent = proto.accent;
  var total = CHK.length;
  var done = CHK.filter(function(r){ return r.done; }).length;
  var esCierre = state.protoKey === "cierre";

  wrap.className = "wrap chk";

  /* barra superior pegada (header + progreso) */
  var back = el("button", { cls:"iconbtn", onClick: goHome }, icon("arrow", 20, "#6B6155"));
  wrap.appendChild(el("div", { cls:"chtop" },
    el("div", { cls:"chead" },
      back,
      el("div", { style:{ flex:"1" } },
        el("div", { cls:"ct", style:{ color:proto.ink }, text:proto.corto }),
        el("div", { cls:"cs", text: done + " de " + total + " marcados" })
      )
    ),
    el("div", { cls:"prog" },
      el("i", { style:{ width: (total? (done/total*100):0)+"%", background:accent } })
    )
  ));

  /* lista */
  var list = el("div", { cls:"list" });
  CHK.forEach(function(row, i){
    var box = el("div", { cls:"box", style: row.done ? { background:accent, borderColor:accent } : {} },
      el("span",{html:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polyline points="20 6 9 17 4 12"/></svg>', style:{opacity: row.done?"1":"0", display:"block"}})
    );
    var item = el("div", { cls:"item"+(row.done?" on":""), onClick:function(){ toggleItem(row); } },
      box,
      el("div", { cls:"lbl", text:row.txt })
    );
    list.appendChild(item);
  });

  /* notas del turno (solo cierre) */
  if(esCierre){
    var ta = el("textarea", { placeholder:"Comentarios u observaciones sobre el turno o cierre" });
    ta.value = NOTA;
    ta.id = "notasTurno";
    noBubble(ta);
    ta.addEventListener("focus", function(){ _notaFocus = true; });
    ta.addEventListener("input", function(){ NOTA = ta.value; });
    ta.addEventListener("blur", function(){ _notaFocus = false; pushNota(); });
    list.appendChild(el("div", { cls:"notas" },
      el("div", { cls:"nt", text:"Notas del turno" }),
      ta
    ));
  }
  wrap.appendChild(list);

  /* footer: marcar como terminado */
  var syncTxt = sb ? "Lista compartida en vivo" : "Sin conexión — modo local (no se comparte)";
  var fin = el("button", { cls:"finish", style:{ background:accent }, onClick:finishProto },
    icon("checkCircle", 20, "#fff", 2.4), "Marcar como terminado");
  wrap.appendChild(el("div", { cls:"cfoot" },
    fin,
    el("div", { cls:"synced"+(sb?"":" off"), text:syncTxt })
  ));
}

/* ---------- PIN ---------- */
function openPin(){ _pinErr=""; state.screen="pin"; render(); }
function renderPin(wrap){
  wrap.className = "wrap full pin";
  var inp = el("input",{type:"password",inputmode:"numeric",autocomplete:"off",maxlength:"12",placeholder:"••••"});
  var err = el("div",{cls:"err",text:_pinErr});
  var enter = el("button",{cls:"btn",text:"Entrar"});
  var back = el("button",{cls:"btn ghost",text:"Volver"});
  var tryIn = function(){
    if(inp.value===ADMIN_PIN){ enterConfig(); }
    else { _pinErr="PIN incorrecto"; render(); }
  };
  enter.addEventListener("click",tryIn);
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") tryIn(); });
  back.addEventListener("click",function(){ state.screen="home"; render(); });
  wrap.append(
    el("h2",{text:"Configuración"}),
    el("p",{text:"Ingresá el PIN para editar los ítems"}),
    inp, err,
    el("div",{cls:"row"}, back, enter)
  );
  setTimeout(function(){ try{inp.focus();}catch(e){} },60);
}

/* ============================================================
   CONFIG — GRILLA EDITABLE CON FILTROS (REUSABLE)
   ============================================================ */
var CFG_ROWS = [];
var CFG_FILTERS = {};
var CFG_MSG = "";
var _pendingFocus = null;
var CFG_TAB = "items";        // "items" | "historial"
var HIST_ROWS = null;         // filas de protocolos_historial (null = sin cargar)
var HIST_OPEN = {};           // ids desplegados en el historial

function enterConfig(){
  CFG_ROWS = [];
  PROTO_KEYS.forEach(function(k){
    PROTOCOLOS[k].items.forEach(function(txt){ CFG_ROWS.push({ proto:PROTO_LABEL[k], txt:txt }); });
  });
  CFG_FILTERS = {}; CFG_MSG = ""; CFG_TAB = "items"; HIST_ROWS = null; HIST_OPEN = {};
  state.screen = "config"; render();
}

function setCfgTab(t){
  CFG_TAB = t; render();
  if(t==="historial" && sb && HIST_ROWS===null) loadHistorial();
}
async function loadHistorial(){
  try{
    var res = await sb.from(DIA_TABLE).select("*").order("dia",{ascending:false}).limit(180);
    if(res.error) throw res.error;
    HIST_ROWS = res.data || [];
  }catch(e){ HIST_ROWS = []; }
  if(state.screen==="config" && CFG_TAB==="historial") render();
}
function cfgTabsBar(){
  function tb(key,label){
    return el("button",{cls:"segbtn"+(CFG_TAB===key?" on":""),text:label,onClick:function(){ if(CFG_TAB!==key) setCfgTab(key); }});
  }
  return el("div",{cls:"seg"}, tb("items","Ítems"), tb("historial","Historial"));
}
function cfgVal(r,key){ return (r[key]==null?"":String(r[key])).trim(); }
function uniqueValues(key){
  var set = new Map();
  CFG_ROWS.forEach(function(r){ set.set(cfgVal(r,key), true); });
  return [...set.keys()].sort(function(a,b){ return a===""? -1 : b===""? 1 : a.localeCompare(b,"es"); });
}
function rowVisible(r){
  return COLUMNS.every(function(c){
    var f = CFG_FILTERS[c.key];
    if(!f) return true;
    return f.has(cfgVal(r,c.key));
  });
}

/* Orden: sube/baja un ítem dentro de su protocolo (saltea filas ocultas por filtro).
   Al guardar, position = orden de CFG_ROWS. */
function cfgNeighbor(idx, dir){
  var p = normProto(CFG_ROWS[idx].proto);
  for(var j=idx+dir; j>=0 && j<CFG_ROWS.length; j+=dir){
    if(rowVisible(CFG_ROWS[j]) && normProto(CFG_ROWS[j].proto)===p) return j;
  }
  return -1;
}
function cfgMove(idx, dir){
  var j = cfgNeighbor(idx, dir);
  if(j<0) return;
  var r = CFG_ROWS.splice(idx,1)[0];
  CFG_ROWS.splice(j,0,r);
  render();
}
function renderConfig(wrap){
  wrap.className = "wrap full cfg";
  if(CFG_TAB==="historial"){ renderConfigHist(wrap); return; }

  var head = el("div",{cls:"chead"},
    el("h2",{text:"Configuración"}),
    cfgTabsBar(),
    el("div",{cls:"hint",html:'Editá cada celda. El <b>embudo</b> de cada columna filtra como en Sheets. Elegí el protocolo (Apertura / Cierre) en su columna. Con <b>▲ ▼</b> cambiás el orden.'})
  );

  var table = el("table",{cls:"grid"});
  var thead = el("thead"); var htr = el("tr");
  htr.appendChild(el("th",{cls:"rownum",text:"#"}));
  COLUMNS.forEach(function(c){
    var active = !!CFG_FILTERS[c.key];
    var fb = el("span",{cls:"fbtn"+(active?" on":""),text:"▾","aria-label":"Filtrar "+c.label});
    var th = el("th",{}, el("div",{cls:"thh"}, el("span",{text:c.label}), fb));
    th.style.cursor = "pointer";
    th.addEventListener("click",function(){ openFilter(c.key, th); });
    htr.appendChild(th);
  });
  htr.appendChild(el("th",{text:"Orden"}));
  htr.appendChild(el("th",{}));
  thead.appendChild(htr); table.appendChild(thead);

  var tbody = el("tbody");
  var shown = 0;
  CFG_ROWS.forEach(function(r, idx){
    if(!rowVisible(r)) return;
    shown++;
    var tr = el("tr");
    tr.appendChild(el("td",{cls:"rownum",text:String(shown)}));
    COLUMNS.forEach(function(c){
      if(c.type==="select"){
        var v = r[c.key]||"";
        var cell = el("button",{cls:"selcell","data-idx":idx,"data-key":c.key},
          el("span",{cls:"cv"+(v?"":" empty"),text: v || "Elegí…"}),
          el("span",{cls:"car",text:"▾"})
        );
        cell.addEventListener("click",function(e){ e.stopPropagation(); openSelect(c, idx, cell); });
        tr.appendChild(el("td",{}, cell));
      } else {
        var inp = el("input",{cls:"cell",type:"text",value:r[c.key]||"","data-idx":idx,"data-key":c.key,
          placeholder: c.required?c.label:(c.label+" (opcional)")});
        inp.addEventListener("input",function(){ CFG_ROWS[idx][c.key]=inp.value; });
        tr.appendChild(el("td",{}, inp));
      }
    });
    var up = el("button",{cls:"moverow",text:"▲","aria-label":"Subir"});
    var down = el("button",{cls:"moverow",text:"▼","aria-label":"Bajar"});
    if(cfgNeighbor(idx,-1)<0) up.disabled = true;
    if(cfgNeighbor(idx,1)<0) down.disabled = true;
    up.addEventListener("click",function(){ cfgMove(idx,-1); });
    down.addEventListener("click",function(){ cfgMove(idx,1); });
    tr.appendChild(el("td",{cls:"movecol"}, el("div",{cls:"movebox"}, up, down)));
    var del = el("button",{cls:"delrow",text:"✕","aria-label":"Borrar fila"});
    del.addEventListener("click",function(){ CFG_ROWS.splice(idx,1); render(); });
    tr.appendChild(el("td",{cls:"delcol"}, del));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  var tblWrap = el("div",{cls:"tbl-wrap"}, table);
  if(shown===0){
    tblWrap.appendChild(el("div",{cls:"norows",text: CFG_ROWS.length? "Ningún ítem coincide con los filtros." : "No hay ítems. Agregá el primero abajo."}));
  }

  var add = el("button",{cls:"addrow",text:"＋ Agregar ítem"});
  add.addEventListener("click",function(){
    CFG_FILTERS = {};
    var lastProto = CFG_ROWS.length? CFG_ROWS[CFG_ROWS.length-1].proto : "Apertura";
    CFG_ROWS.push({ proto:lastProto, txt:"" });
    _pendingFocus = { idx: CFG_ROWS.length-1, key:"txt" };
    render();
  });

  var msg = el("div",{cls:"msg",text:CFG_MSG});
  var restore = el("button",{cls:"restore",text:"Restaurar lista original"});
  restore.addEventListener("click",function(){
    confirmDialog("Esto reemplaza TODOS los ítems por la lista original y borra tus cambios sin guardar. ¿Seguir?", async function(){
      CFG_MSG = "Restaurando…"; render();
      var res = await restoreDefaults();
      if(res.ok){
        CFG_ROWS = [];
        PROTO_KEYS.forEach(function(k){ PROTOCOLOS[k].items.forEach(function(txt){ CFG_ROWS.push({proto:PROTO_LABEL[k], txt:txt}); }); });
        CFG_FILTERS = {}; CFG_MSG = "Lista original cargada. Tocá Guardar para dejarla así.";
      } else CFG_MSG = res.msg;
      render();
    }, "Sí, restaurar");
  });

  var body = el("div",{cls:"cbody"}, tblWrap, add, restore, msg);

  var cancel = el("button",{cls:"btn ghost",text:"Cancelar"});
  var save = el("button",{cls:"btn",text:"Guardar cambios"});
  cancel.addEventListener("click",function(){ state.screen="home"; render(); });
  save.addEventListener("click", async function(){
    save.disabled = true; save.textContent = "Guardando…"; CFG_MSG = "";
    var res = await saveItems(CFG_ROWS);
    if(res.ok){ state.screen="home"; render(); }
    else { CFG_MSG = res.msg; save.disabled=false; save.textContent="Guardar cambios"; render(); }
  });
  var foot = el("div",{cls:"cfoot"}, cancel, save);

  wrap.append(head, body, foot);

  if(_pendingFocus){
    var pf = _pendingFocus; _pendingFocus = null;
    setTimeout(function(){ var n = app.querySelector('input[data-idx="'+pf.idx+'"][data-key="'+pf.key+'"]'); if(n){ try{n.focus();}catch(e){} } },30);
  }
}

/* ---------- CONFIG · HISTORIAL ---------- */
function renderConfigHist(wrap){
  var head = el("div",{cls:"chead"},
    el("h2",{text:"Configuración"}),
    cfgTabsBar(),
    el("div",{cls:"hint",text:"Un registro por día de cada protocolo. Tocá una fila para ver el desglose."})
  );

  var body = el("div",{cls:"hist"});
  if(!sb){
    body.appendChild(el("div",{cls:"hempty",text:"El historial se guarda cuando marcás un protocolo como terminado. Necesita conexión (versión de Netlify); en la vista previa no se guarda."}));
  } else if(HIST_ROWS===null){
    body.appendChild(el("div",{cls:"hempty",text:"Cargando…"}));
  } else if(HIST_ROWS.length===0){
    body.appendChild(el("div",{cls:"hempty",text:"Todavía no hay protocolos guardados. Cuando marques uno como terminado, aparece acá."}));
  } else {
    HIST_ROWS.forEach(function(r){ body.appendChild(histRow(r)); });
  }

  var back = el("button",{cls:"btn ghost",text:"Volver",onClick:function(){ state.screen="home"; render(); }});
  var foot = el("div",{cls:"cfoot"}, back);
  wrap.append(head, body, foot);
}

function histRow(r){
  var items = Array.isArray(r.items) ? r.items : [];
  var total = items.length;
  var done = items.filter(function(x){ return x && x.done; }).length;
  var pct = total ? Math.round(done/total*100) : 0;
  var full = pct===100;
  var pk = normProto(r.proto);
  var accent = PROTOCOLOS[pk] ? PROTOCOLOS[pk].accent : "#8A7F66";
  var d = new Date((r.dia || "") + "T00:00:00");
  var d1 = isNaN(d) ? (r.dia||"") : cap(d.toLocaleDateString("es-UY",{ weekday:"long", day:"2-digit", month:"2-digit", year:"2-digit" }));
  var estado = r.terminado ? (done + "/" + total + " marcados") : ("En curso · " + done + "/" + total);
  var open = !!HIST_OPEN[r.id];

  var pill = el("span",{cls:"hpct",text:pct+"%", style:{
    color: full ? "#2C9E6A" : "#C96A2B",
    background: full ? "#E4F4EC" : "#F6E7D7"
  }});

  var head = el("div",{cls:"hhead", onClick:function(){ HIST_OPEN[r.id] = !open; render(); }},
    el("span",{cls:"hdot", style:{ background:accent }}),
    el("div",{cls:"hdate"},
      el("div",{cls:"d1", text:PROTO_LABEL[pk] + " · " + d1}),
      el("div",{cls:"d2", text:estado})
    ),
    pill,
    el("span",{cls:"hcar", text: open ? "▲" : "▼"})
  );

  var box = el("div",{cls:"hrow"}, head);
  if(open){
    var bodyEl = el("div",{cls:"hbody"});
    items.forEach(function(it){
      var ok = it && it.done;
      bodyEl.appendChild(el("div",{cls:"hitem"},
        el("span",{cls:"hk", style:{ color: ok ? "#2C9E6A" : "#D24B41" }, text: ok ? "✓" : "✗"}),
        el("span",{text: (it && it.txt) || ""})
      ));
    });
    if(pk==="cierre" && r.notas){
      bodyEl.appendChild(el("div",{cls:"hnotas"},
        el("div",{style:{ fontSize:"11px", letterSpacing:"1.5px", textTransform:"uppercase", fontWeight:"800", color:"var(--muted)", marginBottom:"5px" }, text:"Notas del turno"}),
        el("div",{text:r.notas})
      ));
    }
    box.appendChild(bodyEl);
  }
  return box;
}

/* popover genérico anclado a un elemento */
function closePopovers(){ app.querySelectorAll(".scrim,.pop").forEach(function(n){ n.remove(); }); }
function popoverAt(anchor, inner){
  closePopovers();
  var scrim = el("div",{cls:"scrim"}); scrim.addEventListener("click",closePopovers);
  var pop = el("div",{cls:"pop"}, inner); noBubble(pop);
  app.append(scrim, pop);
  var r = anchor.getBoundingClientRect();
  var w = Math.min(268, window.innerWidth*0.84);
  var left = Math.max(8, Math.min(r.left, window.innerWidth-w-8));
  var top = r.bottom+6; var maxTop = window.innerHeight-300; if(top>maxTop) top = Math.max(8, maxTop);
  pop.style.left = left+"px"; pop.style.top = top+"px";
  return pop;
}
function openFilter(key, anchor){
  var values = uniqueValues(key);
  var temp = new Set(CFG_FILTERS[key] ? [...CFG_FILTERS[key]] : values);
  var search = el("input",{type:"text",placeholder:"Buscar…"}); noBubble(search);
  var listBox = el("div",{cls:"plist"});
  function paintList(){
    listBox.innerHTML = "";
    var q = search.value.trim().toLowerCase();
    values.filter(function(v){ return (v===""?"(vacías)":v).toLowerCase().includes(q); }).forEach(function(v){
      var cb = el("input",{type:"checkbox"}); cb.checked = temp.has(v);
      cb.addEventListener("change",function(){ if(cb.checked) temp.add(v); else temp.delete(v); });
      listBox.appendChild(el("label",{cls:"pitem"}, cb,
        el("span",{cls:"pv"+(v===""?" empty":""),text: v===""? "(vacías)" : v})));
    });
  }
  search.addEventListener("input",paintList);
  var selAll = el("button",{text:"Seleccionar todo",onClick:function(){ values.forEach(function(v){ temp.add(v); }); paintList(); }});
  var clr = el("button",{text:"Borrar",onClick:function(){ temp.clear(); paintList(); }});
  var cancelB = el("button",{text:"Cancelar",onClick:closePopovers});
  var okB = el("button",{cls:"ok",text:"Aceptar",onClick:function(){
    if(temp.size===values.length) delete CFG_FILTERS[key];
    else CFG_FILTERS[key] = new Set(temp);
    closePopovers(); render();
  }});
  var inner = el("div",{},
    el("div",{cls:"psearch"}, search),
    el("div",{cls:"pact"}, selAll, clr),
    listBox,
    el("div",{cls:"pfoot"}, cancelB, okB)
  );
  paintList();
  popoverAt(anchor, inner);
  setTimeout(function(){ try{search.focus();}catch(e){} },30);
}
function openSelect(col, idx, anchor){
  var key = col.key;
  var cur = cfgVal(CFG_ROWS[idx], key);
  var opts = col.fixed || uniqueValues(key).filter(function(v){ return v!==""; });
  var list = el("div",{cls:"olist"});
  opts.forEach(function(v){
    list.appendChild(el("div",{cls:"opt"},
      el("span",{cls:"ov"+(v===cur?" cur":""),text:v,
        onClick:function(){ CFG_ROWS[idx][key]=v; closePopovers(); render(); }})));
  });
  var inner = el("div",{}, el("div",{cls:"ptitle",text:col.label}), list);
  popoverAt(anchor, inner);
}

/* sincroniza el textarea de notas sin re-renderizar todo (evita perder foco) */
function syncNotaField(){
  var ta = document.getElementById("notasTurno");
  if(ta && ta.value !== NOTA) ta.value = NOTA;
}

init();
</script>
