<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demeter</title>
<style>
  :root{
    --cream:#F6F1E9;
    --card:#ffffff;
    --ink:#2A241D;
    --muted:#A69B8C;
    --line:#E3DBCE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 440px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 18px); }
  .head { text-align: center; margin: 2px 0 20px; }
  .kicker { font-size: 11px; letter-spacing: 2px; color: #9A8F80; font-weight: 700; }
  h1 { margin: 6px 0 0; font-size: 28px; font-weight: 800; color: var(--ink); font-family: Georgia, serif; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .app { display: flex; align-items: center; gap: 16px; padding: 18px 18px; border-radius: 20px;
    text-decoration: none; border: 1.5px solid var(--line); background: var(--card); transition: transform .12s ease; }
  .app:active { transform: scale(.985); }
  .ico { width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0; display: grid; place-items: center; font-size: 26px; }
  .txt { flex: 1; min-width: 0; }
  .name { font-size: 19px; font-weight: 800; line-height: 1.2; }
  .desc { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .chev { font-size: 22px; font-weight: 700; }
  .app.off { opacity: .55; pointer-events: none; }
  .soon { font-size: 11px; font-weight: 800; letter-spacing: .5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">DEMETER</div>
    <h1>¿Qué vas a hacer?</h1>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
/* Para sumar una app: agregarla acá. href = carpeta de la app en este repo.
   ok:false la muestra como "Próximamente" (sin link). */
var APPS = [
  { href:"protocolos/", nombre:"Protocolos",        desc:"Apertura y cierre del local",      icono:"☀️", color:"#E1902B", soft:"#FBEFD9", ink:"#5A3A12", ok:true  },
  { href:"mise/",       nombre:"Mise and Please",   desc:"Qué hay que producir hoy",         icono:"🥣", color:"#2C9E6A", soft:"#E3F3EA", ink:"#1E4D37", ok:true  },
  { href:"pedidos/",    nombre:"Stock y Pedidos",   desc:"Conteo de stock y pedidos",        icono:"📦", color:"#4A5FA5", soft:"#E7EAF6", ink:"#26305C", ok:true  },
  { href:"guias/",      nombre:"Guías del Local",   desc:"Cobro, atención, limpieza y más",  icono:"📖", color:"#7A5BA6", soft:"#EEE8F6", ink:"#3B2A57", ok:true  }
];

var list = document.getElementById("list");
APPS.forEach(function(a){
  var card = document.createElement(a.ok ? "a" : "div");
  card.className = "app" + (a.ok ? "" : " off");
  if(a.ok) card.href = a.href;
  card.style.background = a.soft;
  card.style.borderColor = a.color + "33";

  var ico = document.createElement("div");
  ico.className = "ico";
  ico.style.background = a.color;
  ico.textContent = a.icono;

  var txt = document.createElement("div");
  txt.className = "txt";
  var name = document.createElement("div");
  name.className = "name";
  name.style.color = a.ink;
  name.textContent = a.nombre;
  var desc = document.createElement("div");
  desc.className = "desc";
  desc.textContent = a.desc;
  txt.append(name, desc);

  var end = document.createElement("div");
  if(a.ok){ end.className = "chev"; end.style.color = a.color; end.textContent = "›"; }
  else { end.className = "soon"; end.textContent = "PRÓXIMAMENTE"; }

  card.append(ico, txt, end);
  list.appendChild(card);
});
</script>
</body>
</html>
