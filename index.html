<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Estilo Demeter (mismo lenguaje que Guías del Local) */
  :root{
    --paper:#faf7f2;
    --paper-2:#ffffff;
    --ink:#1c1a17;
    --muted:#6b6459;
    --chip:#f1ebe0;
    --accent:#1f4e96;
    --line:#e2dbcd;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,sans-serif;
    padding-inline:20px;
    padding-block:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-bottom) + 24px);
  }
  .wrap{max-width:640px;margin:0 auto}

  header.top{
    border-bottom:1mm solid var(--accent);
    padding-bottom:3mm;
    margin-bottom:4mm;
    display:flex;align-items:flex-end;justify-content:space-between;gap:3mm;flex-wrap:wrap;
  }
  header.top h1{margin:0;font:700 24pt/1 Archivo,sans-serif;letter-spacing:-.015em}
  header.top .sub{
    font:700 8.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  }

  .list{display:flex;flex-direction:column}
  .app{
    display:grid;grid-template-columns:11mm 1fr auto;align-items:center;gap:0 2mm;
    padding:4mm 2mm;border-bottom:1px solid var(--line);
    color:var(--ink);text-decoration:none;
  }
  .app:last-child{border-bottom:none}
  a.app:hover,a.app:focus-visible{background:var(--chip);outline:none}
  .num{font:700 8.5pt/1.1 'IBM Plex Mono',monospace;color:var(--accent)}
  .name{font:600 12pt/1.25 Archivo,sans-serif}
  .desc{font:400 10pt/1.35 Archivo,sans-serif;color:var(--muted);margin-top:.8mm}
  .go{font:700 14pt/1 Archivo,sans-serif;color:var(--accent)}
  .app.off{opacity:.55}
  .soon{
    font:700 7.5pt/1.1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:1.5mm;padding:1.4mm 2.4mm;background:var(--paper-2);
  }

  /* acceso al panel de control (para el encargado, con PIN) */
  .admin{
    display:flex;align-items:center;justify-content:space-between;gap:3mm;margin-top:8mm;
    padding:3.4mm 4mm;border:1px dashed #d8d0c2;border-radius:1.5mm;background:var(--paper-2);
    color:var(--ink);text-decoration:none;
  }
  .admin:hover,.admin:focus-visible{border-color:var(--accent);outline:none}
  .admin .t{font:700 8.5pt/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
  .admin .d{font-size:9.5pt;color:var(--muted);margin-top:.8mm}

  @media (max-width:480px){ body{padding-inline:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Demeter</h1>
    <span class="sub" id="count-label"></span>
  </header>
  <nav class="list" id="list" aria-label="Apps del local"></nav>
  <a class="admin" href="panel/">
    <span><span class="t">🔒 Panel de control</span><div class="d">Registros de protocolos, stock y Mise · con PIN</div></span>
    <span class="go" aria-hidden="true">›</span>
  </a>
</div>
<script>
/* Para sumar una app: agregarla acá. href = carpeta de la app en este repo.
   ok:false la muestra como "Próximamente" (sin link). */
var APPS = [
  { href:"protocolos/", nombre:"Protocolos",      desc:"Apertura y cierre del local",     ok:true },
  { href:"mise/",       nombre:"Mise and Please", desc:"Qué hay que producir hoy",        ok:true },
  { href:"pedidos/",    nombre:"Stock y Pedidos", desc:"Conteo de stock y pedidos",       ok:true },
  { href:"guias/",      nombre:"Guías",           desc:"Recetas y guías de cocina",       ok:true }
];

var list = document.getElementById("list");
APPS.forEach(function(a, i){
  var row = document.createElement(a.ok ? "a" : "div");
  row.className = "app" + (a.ok ? "" : " off");
  if(a.ok) row.href = a.href;

  var num = document.createElement("span");
  num.className = "num";
  num.textContent = (i + 1 < 10 ? "0" : "") + (i + 1);

  var txt = document.createElement("span");
  var name = document.createElement("div");
  name.className = "name";
  name.textContent = a.nombre;
  var desc = document.createElement("div");
  desc.className = "desc";
  desc.textContent = a.desc;
  txt.append(name, desc);

  var end = document.createElement("span");
  if(a.ok){ end.className = "go"; end.textContent = "›"; end.setAttribute("aria-hidden", "true"); }
  else { end.className = "soon"; end.textContent = "Próximamente"; }

  row.append(num, txt, end);
  list.appendChild(row);
});
document.getElementById("count-label").textContent = APPS.length + " apps";
</script>
</body>
</html>
